<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Authorized — Weather Radar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e2a44 0%, #0f1526 55%, #0b0f1c 100%);
      color: #e8ecf5; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px; padding: 36px 28px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.45);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .icon {
      width: 56px; height: 56px; margin: 0 auto 16px; display: block;
      color: #8aa4ff;
    }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
    p { margin: 0; color: #aab3c7; font-size: 14px; line-height: 1.5; }
    .hint { margin-top: 18px; font-size: 12px; color: #7b8498; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="10.5" width="16" height="10" rx="2.2"></rect>
      <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path>
      <circle cx="12" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle>
    </svg>
    <h1>Not Authorized</h1>
    <p>A valid access token is required to view this page.</p>
    <div class="hint">If you reached this through a saved link, its token may have been rotated or revoked.</div>
    <div class="hint" style="margin-top:14px;"><a href="/login" style="color:#8aa4ff;">Sign in</a></div>
  </div>
</body>
</html>
