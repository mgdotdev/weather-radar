<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Tokens — Weather Radar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
      background: #f3f4f6; color: #1f2430; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 9px 11px;
      border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 9px 14px;
      font-size: 14px; font-weight: 600; }
    .primary { background: #2563eb; color: #fff; }
    .danger { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row > div { flex: 1 1 auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #f0f0f0; }
    th { color: #6b7280; font-weight: 600; font-size: 12px; }
    .muted { color: #9ca3af; font-size: 12px; }
    .secret { font-family: ui-monospace, Menlo, monospace; word-break: break-all;
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 10px; font-size: 13px; }
    .err { color: #b91c1c; font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }
    .pill { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      background: #f3f4f6; border-radius: 6px; padding: 2px 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav aria-label="Breadcrumb" style="font-size:13px; margin-bottom:10px; color:#6b7488;">
      <a href="/admin" style="color:#8aa4ff; text-decoration:none;">Admin</a>
      <span style="margin:0 6px;">/</span>
      <span>Access tokens</span>
    </nav>
    <h1>Access Tokens</h1>

    <div id="loginCard" class="card hidden">
      <label for="pw">Admin password</label>
      <div class="row">
        <div><input id="pw" type="password" autocomplete="current-password" placeholder="password" /></div>
        <button class="primary" id="loginBtn">Sign in</button>
      </div>
      <div id="loginErr" class="err hidden"></div>
    </div>

    <div id="panel" class="hidden">
      <div class="card">
        <label for="label">Generate a new access token</label>
        <div class="row">
          <div><input id="label" type="text" placeholder="label (e.g. HA dashboard)" /></div>
          <button class="primary" id="genBtn">Generate</button>
        </div>
        <div id="newToken" class="hidden" style="margin-top:12px;">
          <div class="muted">Copy this now — it won't be shown again:</div>
          <div class="secret" id="newTokenVal"></div>
          <div class="muted" style="margin-top:8px;">Example iframe URL:</div>
          <div class="secret" id="newTokenUrl"></div>
        </div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <strong>Active tokens</strong>
          <button id="logoutBtn" style="background:#f3f4f6;">Sign out</button>
        </div>
        <table>
          <thead><tr><th>Label</th><th>Token</th><th>Created</th><th>Expires</th><th></th></tr></thead>
          <tbody id="tokenRows"></tbody>
        </table>
        <div id="noTokens" class="muted hidden" style="padding:10px 0;">No tokens yet.</div>
      </div>
    </div>
  </div>

  <script>
    const loginCard = document.getElementById("loginCard");
    const panel = document.getElementById("panel");
    const loginErr = document.getElementById("loginErr");

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
      const res = await fetch(path, opts);
      let data = null;
      try { data = await res.json(); } catch (_) {}
      return { ok: res.ok, status: res.status, data };
    }

    function fmtTime(sec) {
      if (!sec) return "—";
      try { return new Date(sec * 1000).toLocaleString(); } catch (_) { return "—"; }
    }

    async function refreshStatus() {
      const { data } = await api("GET", "/api/auth/status");
      if (data && data.authenticated) { showPanel(); }
      else { showLogin(data && data.password_configured); }
    }

    function showLogin(passwordConfigured) {
      loginCard.classList.remove("hidden");
      panel.classList.add("hidden");
      if (passwordConfigured === false) {
        loginErr.textContent = "No admin password configured; token management is localhost-only.";
        loginErr.classList.remove("hidden");
      }
    }
    function showPanel() {
      loginCard.classList.add("hidden");
      panel.classList.remove("hidden");
      loadTokens();
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      loginErr.classList.add("hidden");
      const pw = document.getElementById("pw").value;
      const { ok } = await api("POST", "/api/auth/login", { password: pw });
      if (ok) { document.getElementById("pw").value = ""; showPanel(); }
      else { loginErr.textContent = "Invalid password."; loginErr.classList.remove("hidden"); }
    });
    document.getElementById("pw").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await api("POST", "/api/auth/logout");
      showLogin();
    });

    async function loadTokens() {
      const { ok, data } = await api("GET", "/api/auth/tokens");
      if (!ok) { showLogin(); return; }
      const rows = document.getElementById("tokenRows");
      rows.innerHTML = "";
      const tokens = (data && data.tokens) || [];
      document.getElementById("noTokens").classList.toggle("hidden", tokens.length > 0);
      for (const t of tokens) {
        const tr = document.createElement("tr");
        const exp = t.expired ? "expired" : fmtTime(t.expires);
        tr.innerHTML =
          `<td>${escapeHtml(t.label) || "<span class='muted'>(none)</span>"}</td>` +
          `<td><span class="pill">${escapeHtml(t.preview || t.id)}</span></td>` +
          `<td>${fmtTime(t.created)}</td>` +
          `<td>${escapeHtml(exp)}</td>` +
          `<td style="text-align:right;"></td>`;
        const btn = document.createElement("button");
        btn.className = "danger"; btn.textContent = "Revoke";
        btn.addEventListener("click", async () => {
          if (!confirm("Revoke this token? Any client using it will lose access.")) return;
          await api("DELETE", `/api/auth/tokens/${encodeURIComponent(t.id)}`);
          loadTokens();
        });
        tr.lastElementChild.appendChild(btn);
        rows.appendChild(tr);
      }
    }

    document.getElementById("genBtn").addEventListener("click", async () => {
      const label = document.getElementById("label").value.trim();
      const { ok, data } = await api("POST", "/api/auth/tokens", { label });
      if (ok && data && data.created) {
        const tok = data.created.token;
        document.getElementById("newTokenVal").textContent = tok;
        const u = new URL("/map/models/temperature/", window.location.origin);
        u.searchParams.set("token", tok);
        document.getElementById("newTokenUrl").textContent = u.toString();
        document.getElementById("newToken").classList.remove("hidden");
        document.getElementById("label").value = "";
        loadTokens();
      }
    });

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    refreshStatus();
  </script>
</body>
</html>
