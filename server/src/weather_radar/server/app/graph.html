<html>
<head>
	<script src='https://cdn.plot.ly/plotly-2.35.2.min.js'></script>
  {{dark_mode}}
</head>

<body style="height: 100vh; width: 100vw; margin: 0px; padding: 0px;">
	<div id='graph' style="height: 100vh; width: 100vw; margin: 0px; padding: 0px;"/>
</body>
<script>

  // Forward ?token=… to same-origin API requests (credentialed/iframe access;
  // see map.html). No-op when no token is present.
  (function () {
    const WR_TOKEN = new URL(window.location.href).searchParams.get("token");
    if (!WR_TOKEN) return;
    const _fetch = window.fetch;
    window.fetch = function (input, init) {
      try {
        let url = (typeof input === "string") ? input : (input && input.url);
        if (url) {
          const u = new URL(url, window.location.origin);
          if (u.origin === window.location.origin && !u.searchParams.has("token")) {
            u.searchParams.set("token", WR_TOKEN);
            input = (typeof input === "string") ? u.toString() : new Request(u.toString(), input);
          }
        }
      } catch (_) {}
      return _fetch.call(this, input, init);
    };
  })();

  let layout = {}
  let is_ha = {{is_ha}}
  if (is_ha) {
    Object.assign(
      layout,
      {
        showlegend: true,
        legend: {
          orientation: "h",
          yref: "container",
          xref: "container",
          x: 0.125,
          y: 0.955,
          xanchor: "left",
          yanchor: "top",
        },
        font: {
          size: 12
        },
        margin: {
          t: 70
        }
      }
    )
  }
  else {
    Object.assign(
      layout,
      {
        showlegend: true,
        legend: {
          xanchor: "right",
        },
        font: {
          size: 24
        }
      }
    )
  }

  let data = []

  Plotly.newPlot('graph', data, layout);

  document.addEventListener("DOMContentLoaded", async function() {
    let dt = {{dt}}
    let counts = {{counts}}
    let lat = {{starting_latitude}}
    let lon = {{starting_longitude}}
    let models = {{weather_models}}

    for (let model of Object.keys(models)) {
      let params = models[model]
      for (let param of params) {
        let url = `/api/models/${model}/params/${param}`
        let query = `?lat=${lat}&lon=${lon}&dt=${dt}&counts=${counts}`
        let res = await fetch(url+query).then(res => res.json())
        let x = []
        let y = []
        for (let feature of res.features) {
          y.push(feature["properties"][param])
          x.push(feature["properties"]["time"])
        }
        let unit = res.features[0]["properties"]["uom"]
        let trace = {
          x: x,
          y: y,
          type: 'scatter',
          name: `${param} (${unit})`,
        }
        data.push(trace)
      }
    }
    Plotly.redraw('graph', data, layout);
  })
</script>
</html>
