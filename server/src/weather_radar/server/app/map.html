<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://unpkg.com/maplibre-gl@^4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- d3-contour builds filled isobands from a regular grid of values. -->
    <script src="https://unpkg.com/d3-contour@4"></script>
    <style>
      /* Shared styles for the legend's control buttons/values so the −/+
         columns line up across rows. */
      .ctlbtn {
        cursor: pointer; width: 22px; height: 22px; padding: 0;
        border: 1px solid #bbb; border-radius: 4px; background: #f5f5f5;
        font-size: 14px; line-height: 1;
      }
      .ctlval {
        text-align: center; font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body style="margin: 0px; padding: 0px;">
    <div id="weatherRadar" style="height: 100vh; width: 100vw; margin: 0px; padding: 0px;"/>

    <!-- Color legend (draggable), shown once the field renders. Fixed width
         so it never grows/shrinks as the (variable-length) timestamp updates. -->
    <div id="legend" style="
        position: fixed; top: 50px; left: 20px; z-index: 100;
        display: none; background: rgba(255,255,255,0.85); box-sizing: border-box;
        width: 360px;
        padding: 8px 10px; border-radius: 6px; font-family: sans-serif;
        font-size: 12px; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        cursor: move; user-select: none;">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
        <select id="modelSelect" title="Weather model"
          style="flex:1 1 auto; min-width:0; font-size:12px; font-weight:600;
          padding:2px 4px; border:1px solid #bbb; border-radius:4px; background:#fff; cursor:pointer;"></select>
        <span id="legendUnits" style="font-size:11px; color:#555; white-space:nowrap;"></span>
      </div>
      <div id="legendBar" style="height: 12px; width: 100%; border-radius: 2px;
        border: 1px solid rgba(0,0,0,0.2); box-sizing: border-box;"></div>
      <div style="display: flex; justify-content: space-between; margin-top: 2px;">
        <span id="legendMin"></span>
        <span id="legendMid"></span>
        <span id="legendMax"></span>
      </div>
      <!-- Playback controls. Rows share a grid so the −/+ buttons line up in
           consistent columns regardless of label/value width. -->
      <div style="margin-top:8px; padding-top:6px; border-top:1px solid rgba(0,0,0,0.12);">
        <!-- Play/Pause sits beside a custom range scrubber: two bar handles
             set the playback window [start, end] and a circle is the current
             time (constrained between the bars). All three are draggable. -->
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
          <button id="playPause" title="Pause / Play" style="cursor:pointer; flex:0 0 auto; height:24px; width:28px;
            display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box;
            border:1px solid #bbb; border-radius:4px; background:#f5f5f5; font-size:12px; line-height:1; padding:0;">⏸</button>
          <svg id="timeScrubber" width="100%" height="28" style="flex:1 1 auto; min-width:0; touch-action:none; overflow:visible;">
            <!-- Full track -->
            <line id="scTrack" x1="0" y1="14" x2="100%" y2="14" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
            <!-- Active window segment (between start & end bars) -->
            <line id="scActive" x1="0" y1="14" x2="0" y2="14" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
            <!-- Start / end bound handles -->
            <rect id="scStart" x="0" y="4" width="6" height="20" rx="2" fill="#1565c0" stroke="#fff" stroke-width="1" style="cursor:ew-resize"/>
            <rect id="scEnd" x="0" y="4" width="6" height="20" rx="2" fill="#1565c0" stroke="#fff" stroke-width="1" style="cursor:ew-resize"/>
            <!-- Current-time playhead -->
            <circle id="scPlayhead" cx="0" cy="14" r="7" fill="#fff" stroke="#1565c0" stroke-width="2.5" style="cursor:grab"/>
          </svg>
        </div>
        <div id="timeSliderLabel" style="font-size:13px; color:#333; text-align:center;
          margin-bottom:6px; font-variant-numeric:tabular-nums; font-weight:600;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">—</div>
        <div style="display:grid; grid-template-columns:1fr 22px 52px 22px; align-items:center;
            column-gap:6px; row-gap:6px;">
          <span style="font-size:11px; color:#555;">Speed</span>
          <button id="speedDown" title="Slower" class="ctlbtn">−</button>
          <span id="speedLabel" class="ctlval">1.0×</span>
          <button id="speedUp" title="Faster" class="ctlbtn">+</button>

          <span style="font-size:11px; color:#555;">Time</span>
          <button id="dtDown" title="Smaller time step" class="ctlbtn">−</button>
          <span id="dtLabel" class="ctlval">1h</span>
          <button id="dtUp" title="Larger time step" class="ctlbtn">+</button>

          <span id="contourRowLabel" style="font-size:11px; color:#555;">Contour</span>
          <button id="stepDown" title="Finer contours" class="ctlbtn">−</button>
          <span id="stepLabel" class="ctlval">1°</span>
          <button id="stepUp" title="Coarser contours" class="ctlbtn">+</button>
        </div>
      </div>
    </div>

    <!-- Cursor readout: follows the pointer with the interpolated value. -->
    <div id="cursorReadout" style="
        position: fixed; z-index: 101; display: none; pointer-events: none;
        background: rgba(0,0,0,0.75); color: #fff; font-family: sans-serif;
        font-size: 12px; padding: 4px 7px; border-radius: 4px;
        white-space: nowrap;"></div>

    <!-- Right-click context menu. -->
    <div id="contextMenu" style="
        position: fixed; z-index: 102; display: none;
        background: #fff; border: 1px solid rgba(0,0,0,0.2); border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-family: sans-serif;
        font-size: 13px; color: #222; overflow: hidden; min-width: 160px;">
      <div id="ctxCenterHere" style="padding: 8px 12px; cursor: pointer;">Center map here</div>
      <div id="ctxCaptureArea" style="padding: 8px 12px; cursor: pointer; border-top: 1px solid #eee;">Capture area</div>
      <div id="ctxDropPin" style="padding: 8px 12px; cursor: pointer; border-top: 1px solid #eee;">Drop pin here</div>
      <div id="ctxSeeGraph" style="padding: 8px 12px; cursor: pointer; border-top: 1px solid #eee;">See graph</div>
      <div id="ctxCoords" style="padding: 6px 12px; font-size: 11px;
        color: #666; border-top: 1px solid #eee;"></div>
    </div>

    <!-- Container for dropped pin labels (positioned over the map in JS). -->
    <div id="pins"></div>

    <!-- Loading spinner, shown while data is being cached/fetched. -->
    <style>@keyframes wrspin { to { transform: rotate(360deg); } }</style>
    <div id="spinner" style="
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 103; display: none; pointer-events: none;
        text-align: center; font-family: sans-serif; color: #1565c0;">
      <div style="width: 44px; height: 44px; margin: 0 auto 6px;
          border: 5px solid rgba(21,101,192,0.25); border-top-color: #1565c0;
          border-radius: 50%; animation: wrspin 0.8s linear infinite;"></div>
      <div id="spinnerText" style="font-size: 12px; background: rgba(255,255,255,0.85);
          padding: 2px 8px; border-radius: 4px;">Loading data…</div>
    </div>
  </body>
  <script>
    // ---- Config (from the server) ------------------------------------------
    const model = {{weather_model}}
    const kind = "{{kind}}"
    let lat = {{starting_latitude}}
    let lon = {{starting_longitude}}
    let width = {{width}}
    let height = {{height}}
    let dt = {{dt}}
    const colorRamp = {{contour_color_ramp}}
    // Available models for the in-legend selector, and the current one.
    const modelOptions = {{model_options}}
    const currentModel = "{{current_model}}"
    // Overlay type chosen by the server for this model: "isoband" (filled
    // d3-contour bands + lines) or "heatmap" (a continuous intensity wash
    // whose opacity scales with value). Both consume the same IDW raster.
    const renderType = "{{render_type}}"
    const isHeatmap = renderType === "heatmap"
    // Contour interval: the value delta between adjacent contour lines
    // (e.g. 1.0, 0.5, 2.0 degrees). Configurable live in the legend.
    let contourStep = {{contour_step}}
    // When true, the step auto-scales to the data's global range (targeting a
    // readable number of bands). Any manual change in the legend turns this
    // off so the user's choice sticks. Set false when `step` is in the URL.
    let autoStep = {{auto_step}}

    // Fixed color-scale range across the whole forecast lifecycle, fetched
    // once before the first render so colors/legend stay stable over time.
    // Null until fetched (then buildContours falls back to the frame range).
    let globalMin = null, globalMax = null
    // Forecast time window (epoch seconds) for the current area, from the
    // range API — the FULL available range. Null until fetched.
    let forecastStart = null, forecastEnd = null
    // Active playback window (epoch seconds): the user-adjustable [start, end]
    // the scrubber spans and the animation loops over. Defaults to the full
    // forecast window; always kept within [forecastStart, forecastEnd].
    let windowStart = null, windowEnd = null
    // IANA timezone of the map center (from NOAA /points); null => browser-local.
    let mapTimeZone = null
    let lastFeatures = []  // most recent frame's points (for instant re-render on contour-step change)
    let lastUnits = ""     // unit of the most recent frame (reused on re-render when uom omitted)

    // Grid resolution and interpolation smoothing for the contour field.
    // The isoband raster is GRID_MAX at most, but we ADAPT it per view toward
    // the data's real resolution: NOAA gridpoints are ~2.5km apart, so a raster
    // cell finer than that adds geometric smoothness but no new data detail.
    // gridResFor() picks a size ~matching 2.5km cells for the current extent,
    // clamped to [GRID_MIN, GRID_MAX]. Smoothness comes ENTIRELY from denser
    // interpolation of the real field (no cosmetic geometry smoothing); cost is
    // O(GRID^2 * K) per frame, kept affordable by the nearest-K bucket index.
    const GRID_MIN = 96
    const GRID_MAX = 256
    // Target raster cell size in km (≈ NOAA gridpoint spacing). Finer than this
    // yields diminishing returns since the underlying points are ~2.5km apart.
    const TARGET_CELL_KM = 2.0
    function gridResFor(wKm, hKm) {
      const span = Math.max(wKm || 0, hKm || 0)
      const n = Math.round(span / TARGET_CELL_KM)
      return Math.max(GRID_MIN, Math.min(GRID_MAX, n))
    }
    // Max source points considered per raster cell (nearest-first). Enough to
    // blend smoothly without the full O(points) sum at every cell.
    const IDW_K = 12
    // IDW smoothing radius (squared, in deg^2) added to each weight's
    // denominator. NOAA gridpoints are ~2.5km (~0.023 deg) apart; a radius
    // around half the spacing blends neighbors smoothly and avoids the
    // "bull's-eye" rings that appear when points dominate tight circles.
    const IDW_EPS = 0.015 * 0.015
    const COLOR_BUFFER = 0.1

    const initialZoom = parseFloat(new URL(window.location.href).searchParams.get("zoom")) || 9

    const map = new maplibregl.Map({
      container: "weatherRadar",
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [lon, lat],
      zoom: initialZoom,
    })

    // Distance scale bar (bottom-left; bottom-right holds the basemap
    // attribution, top-left holds the legend). Metric units; `maxWidth` is the
    // bar's max pixel length, which MapLibre rounds to a nice round distance
    // for the current zoom/latitude (e.g. 1 km, 500 m).
    map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }), "bottom-left")

    // Keep the loading spinner pinned over the area center as the map moves.
    map.on("move", () => positionSpinnerOverArea())

    // ---- Spinner ------------------------------------------------------------
    const spinnerEl = document.getElementById("spinner")
    const spinnerTextEl = document.getElementById("spinnerText")
    // Keep the spinner pinned over the CENTER OF THE AREA being loaded (the
    // geographic center lat/lon), not the viewport center — so if the user
    // pans/zooms while data loads, the spinner stays on the loading region.
    function positionSpinnerOverArea() {
      if (spinnerEl.style.display === "none") return
      // Only called after the map exists (from showSpinner during load and
      // the map 'move' handler), so `map` is always initialized here.
      const p = map.project([lon, lat])
      spinnerEl.style.left = `${p.x}px`
      spinnerEl.style.top = `${p.y}px`
    }
    function showSpinner(msg) {
      spinnerTextEl.textContent = msg || "Loading data…"
      spinnerEl.style.display = "block"
      positionSpinnerOverArea()
    }
    function hideSpinner() { spinnerEl.style.display = "none" }
    // Show a per-phase completed/total fraction, e.g. "Resolving grid… 12 / 48"
    // then "Fetching data… 30 / 46". Points and gridpoints are counted
    // separately.
    const PHASE_LABELS = { points: "Resolving grid", gridpoints: "Fetching data" }
    function setSpinnerProgress(phase, done, total) {
      const label = PHASE_LABELS[phase] || "Loading"
      spinnerTextEl.textContent = total
        ? `${label}… ${done} / ${total}`
        : `${label}…`
    }

    // ---- Color ramp ---------------------------------------------------------
    const rampStops = (() => {
      const stops = []
      for (let i = 0; i < colorRamp.length; i += 2) {
        const m = String(colorRamp[i + 1]).match(/rgba?\(([^)]+)\)/)
        const p = m[1].split(',').map(s => parseFloat(s.trim()))
        stops.push({ pos: colorRamp[i], r: p[0], g: p[1], b: p[2] })
      }
      return stops
    })()
    function rampColorAt(t) {
      t = Math.max(0, Math.min(1, t))
      let a = rampStops[0], b = rampStops[rampStops.length - 1]
      for (let i = 0; i < rampStops.length - 1; i++) {
        if (t >= rampStops[i].pos && t <= rampStops[i + 1].pos) { a = rampStops[i]; b = rampStops[i + 1]; break }
      }
      const span = (b.pos - a.pos) || 1
      const f = (t - a.pos) / span
      return `rgb(${Math.round(a.r + (b.r - a.r) * f)}, ${Math.round(a.g + (b.g - a.g) * f)}, ${Math.round(a.b + (b.b - a.b) * f)})`
    }
    // Numeric [r,g,b] variant of rampColorAt for hot pixel loops (the heatmap
    // raster), avoiding per-pixel string formatting/parsing.
    function rampRgbAt(t) {
      t = Math.max(0, Math.min(1, t))
      let a = rampStops[0], b = rampStops[rampStops.length - 1]
      for (let i = 0; i < rampStops.length - 1; i++) {
        if (t >= rampStops[i].pos && t <= rampStops[i + 1].pos) { a = rampStops[i]; b = rampStops[i + 1]; break }
      }
      const span = (b.pos - a.pos) || 1
      const f = (t - a.pos) / span
      return [a.r + (b.r - a.r) * f, a.g + (b.g - a.g) * f, a.b + (b.b - a.b) * f]
    }

    // ---- Legend -------------------------------------------------------------
    let legendInitialized = false
    function legendGradientCss() {
      const stops = []
      for (let i = 0; i < colorRamp.length; i += 2) {
        stops.push(`${colorRamp[i + 1]} ${Math.round(colorRamp[i] * 100)}%`)
      }
      return `linear-gradient(to right, ${stops.join(", ")})`
    }
    function updateLegend(vMin, vMax, units) {
      if (!legendInitialized) {
        document.getElementById("legendBar").style.background = legendGradientCss()
        legendInitialized = true
      }
      document.getElementById("legendUnits").textContent = units ? `(${units})` : ""
      document.getElementById("legendMin").textContent = vMin.toFixed(1)
      document.getElementById("legendMid").textContent = ((vMin + vMax) / 2).toFixed(1)
      document.getElementById("legendMax").textContent = vMax.toFixed(1)
      document.getElementById("legend").style.display = "block"
    }

    // ---- Field raster (shared by all overlays) -----------------------------

    // IDW-resample the scatter of points ({lon,lat,v}) onto a regular lattice
    // adapted to the current view extent. Returns
    //   { GRID, minLon, maxLon, minLat, maxLat, values, vMin, vMax }
    // (values is row-major, row 0 = minLat), or null if there isn't enough
    // data / the field is flat. Both the isoband and heatmap overlays consume
    // this, so the interpolation is defined once.
    function buildField(points) {
      // Raster resolution adapted to the current view extent (toward ~2.5km
      // data resolution), clamped. Local to this call so a recenter/zoom picks
      // the right size without touching the rest of the function.
      const GRID = gridResFor(width, height)
      // Pack the finite points into parallel typed arrays once. The hot IDW
      // loop below reads these by index (cache-friendly, zero per-cell object
      // allocation) instead of walking arrays of {lon,lat,v} objects.
      const srcN0 = points.length
      const ptLon = new Float64Array(srcN0)
      const ptLat = new Float64Array(srcN0)
      const ptV = new Float64Array(srcN0)
      let nPts = 0
      for (let i = 0; i < srcN0; i++) {
        const p = points[i]
        if (Number.isFinite(p.v)) { ptLon[nPts] = p.lon; ptLat[nPts] = p.lat; ptV[nPts] = p.v; nPts++ }
      }
      if (nPts < 3) return null

      // Bounds (plain loop; avoids Math.min(...spread) which allocates and can
      // overflow the arg stack on large point sets).
      let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity
      for (let i = 0; i < nPts; i++) {
        const lo = ptLon[i], la = ptLat[i]
        if (lo < minLon) minLon = lo
        if (lo > maxLon) maxLon = lo
        if (la < minLat) minLat = la
        if (la > maxLat) maxLat = la
      }
      const padLon = (maxLon - minLon) * 0.05 || 0.01
      const padLat = (maxLat - minLat) * 0.05 || 0.01
      minLon -= padLon; maxLon += padLon; minLat -= padLat; maxLat += padLat

      // Spatial bucket index over the source points so each raster cell can
      // do IDW over just its nearest-K points instead of all of them. Bucket
      // grid is sized to the point set (~a handful of points per bucket), so a
      // small neighborhood of buckets around a cell yields enough candidates.
      const spanLon = (maxLon - minLon) || 1e-6
      const spanLat = (maxLat - minLat) || 1e-6
      // Aim for roughly one bucket per source point, capped so the bucket grid
      // isn't absurdly fine/coarse.
      const bN = Math.max(1, Math.min(GRID, Math.round(Math.sqrt(nPts))))
      const nB = bN * bN
      const bOfIdx = (i) => {
        let bx = Math.floor(((ptLon[i] - minLon) / spanLon) * bN)
        let by = Math.floor(((ptLat[i] - minLat) / spanLat) * bN)
        if (bx < 0) bx = 0; else if (bx > bN - 1) bx = bN - 1
        if (by < 0) by = 0; else if (by > bN - 1) by = bN - 1
        return by * bN + bx
      }
      // CSR-style bucket index built by counting sort: bucketStart[b]..
      // bucketStart[b+1] is the slice of `bucketPts` (point indices) in bucket
      // b. No array-of-arrays, no per-point push.
      const bucketCount = new Int32Array(nB)
      for (let i = 0; i < nPts; i++) bucketCount[bOfIdx(i)]++
      const bucketStart = new Int32Array(nB + 1)
      for (let b = 0; b < nB; b++) bucketStart[b + 1] = bucketStart[b] + bucketCount[b]
      const bucketPts = new Int32Array(nPts)
      const cursor = bucketStart.slice(0, nB) // mutable write cursors per bucket
      for (let i = 0; i < nPts; i++) {
        const b = bOfIdx(i)
        bucketPts[cursor[b]++] = i
      }

      // Scratch for the K nearest, reused across every raster cell (no
      // allocation in the hot loop). bestD2/bestIdx hold the current K-nearest
      // kept so far, unordered; `worstSlot` tracks the largest d2 among them so
      // a new candidate only displaces it if strictly nearer.
      const K = IDW_K
      const bestD2 = new Float64Array(K)
      const bestIdx = new Int32Array(K)

      // IDW value at (plon,plat) from the nearest ~K source points, found by
      // expanding bucket rings outward until enough candidates are gathered.
      function idwValue(plon, plat) {
        let cbx = Math.floor(((plon - minLon) / spanLon) * bN)
        let cby = Math.floor(((plat - minLat) / spanLat) * bN)
        if (cbx < 0) cbx = 0; else if (cbx > bN - 1) cbx = bN - 1
        if (cby < 0) cby = 0; else if (cby > bN - 1) cby = bN - 1

        // Expand ring radius until we've SCANNED at least K candidates (or
        // covered the whole bucket grid), matching the original stop rule;
        // then the final ring's candidates are all considered for nearest-K.
        for (let r = 0; r < bN; r++) {
          let kept = 0            // how many of bestD2/bestIdx are populated
          let worstSlot = -1      // slot holding the current largest kept d2
          let worstD2 = -Infinity
          let scanned = 0
          const x0 = cbx - r < 0 ? 0 : cbx - r
          const x1 = cbx + r > bN - 1 ? bN - 1 : cbx + r
          const y0 = cby - r < 0 ? 0 : cby - r
          const y1 = cby + r > bN - 1 ? bN - 1 : cby + r
          for (let by = y0; by <= y1; by++) {
            const rowBase = by * bN
            for (let bx = x0; bx <= x1; bx++) {
              const b = rowBase + bx
              const s = bucketStart[b], e = bucketStart[b + 1]
              for (let j = s; j < e; j++) {
                const pi = bucketPts[j]
                const dLon = plon - ptLon[pi], dLat = plat - ptLat[pi]
                const d2 = dLon * dLon + dLat * dLat
                scanned++
                if (d2 < 1e-12) return ptV[pi]  // exact hit
                // Bounded insertion into the K-nearest scratch.
                if (kept < K) {
                  bestD2[kept] = d2; bestIdx[kept] = pi; kept++
                  if (kept === K) {
                    // Find the worst (largest) once the buffer fills.
                    worstD2 = -Infinity; worstSlot = 0
                    for (let m = 0; m < K; m++) if (bestD2[m] > worstD2) { worstD2 = bestD2[m]; worstSlot = m }
                  }
                } else if (d2 < worstD2) {
                  // Replace the current worst, then rescan for the new worst.
                  bestD2[worstSlot] = d2; bestIdx[worstSlot] = pi
                  worstD2 = -Infinity
                  for (let m = 0; m < K; m++) if (bestD2[m] > worstD2) { worstD2 = bestD2[m]; worstSlot = m }
                }
              }
            }
          }
          const coveredAll = (x0 === 0 && y0 === 0 && x1 === bN - 1 && y1 === bN - 1)
          if (scanned >= K || coveredAll) {
            // Weighted sum over the kept K-nearest (IDW power 2).
            let num = 0, den = 0
            for (let m = 0; m < kept; m++) {
              const w = 1 / (bestD2[m] + IDW_EPS)
              num += w * ptV[bestIdx[m]]; den += w
            }
            return den > 0 ? num / den : NaN
          }
          // else: not enough candidates yet — widen the ring and retry. (Scratch
          // is rebuilt from scratch next iteration via the `kept`/`worst*`
          // resets at the top of the loop body.)
        }
        return NaN
      }

      // IDW resample onto a GRID x GRID lattice (row 0 = minLat).
      const values = new Float64Array(GRID * GRID)
      let vMin = Infinity, vMax = -Infinity
      for (let gy = 0; gy < GRID; gy++) {
        const plat = minLat + (gy / (GRID - 1)) * (maxLat - minLat)
        for (let gx = 0; gx < GRID; gx++) {
          const plon = minLon + (gx / (GRID - 1)) * (maxLon - minLon)
          const val = idwValue(plon, plat)
          values[gy * GRID + gx] = val
          if (val < vMin) vMin = val
          if (val > vMax) vMax = val
        }
      }
      return { GRID, minLon, maxLon, minLat, maxLat, values, vMin, vMax }
    }

    // Shared color-scale resolution: prefer the FIXED global range (whole
    // forecast lifecycle) so a given value is the same color in every frame
    // and the legend never shifts; fall back to the frame's own range.
    function colorScale(vMin, vMax) {
      const cMin = (globalMin !== null) ? globalMin : vMin
      const cMax = (globalMax !== null && globalMax > globalMin) ? globalMax : vMax
      return { cMin, cMax, cSpan: (cMax - cMin) || 1 }
    }

    // ---- Contour construction ----------------------------------------------

    // Build filled contour polygons (GeoJSON) from a scatter of points
    // ({lon, lat, v}). Returns { fc, vMin, vMax, units } or null.
    function buildContours(points) {
      const field = buildField(points)
      if (!field) return null
      const { GRID, minLon, maxLon, minLat, maxLat, values, vMin, vMax } = field
      // If the field is completely flat (e.g. an all-zero accumulation like
      // snowfall with no snow forecast), there are no contours to draw. Emit
      // an empty collection rather than letting d3-contour produce spurious
      // full-extent polygons for thresholds at/below the constant value.
      const FLAT_EPS = 1e-9
      if (!(vMax - vMin > FLAT_EPS)) {
        return { fc: { type: "FeatureCollection", features: [] }, vMin, vMax, units: lastUnits || "" }
      }

      // Color scale: use the FIXED global range (whole forecast lifecycle)
      // when available, so a given temperature is the same color in every
      // frame and the legend never shifts. Fall back to the frame's own range.
      const { cMin, cMax, cSpan } = colorScale(vMin, vMax)

      // Thresholds are anchored to FIXED absolute values spaced `contourStep`
      // apart (e.g. every 1.0 degree), so a given isoline is always at the
      // same absolute value every frame. Only thresholds that lie strictly
      // INSIDE the field's (vMin, vMax) range are kept: a threshold at or
      // beyond the extremes isn't actually crossed by the field, and d3
      // would otherwise emit a spurious full-extent (or empty) polygon.
      const step = contourStep
      const tLo = Math.ceil(vMin / step) * step
      const tHi = Math.floor(vMax / step) * step
      const thresholds = []
      for (let tv = tLo; tv <= tHi + 1e-9; tv += step) {
        if (tv > vMin + 1e-9 && tv < vMax - 1e-9) thresholds.push(tv)
      }
      if (!thresholds.length) {
        return { fc: { type: "FeatureCollection", features: [] }, vMin, vMax, units: lastUnits || "" }
      }

      const polys = d3.contours().size([GRID, GRID]).thresholds(thresholds)(values)

      const sx = (maxLon - minLon) / (GRID - 1)
      const sy = (maxLat - minLat) / (GRID - 1)
      const toLngLat = ([gx, gy]) => [minLon + gx * sx, minLat + gy * sy]

      const outFeatures = polys.map(poly => {
        const raw = (poly.value - cMin) / cSpan
        const t = COLOR_BUFFER + Math.max(0, Math.min(1, raw)) * (1 - 2 * COLOR_BUFFER)
        return {
          type: "Feature",
          properties: { fillColor: rampColorAt(t) },
          geometry: {
            type: "MultiPolygon",
            coordinates: poly.coordinates.map(pg => pg.map(ring => ring.map(toLngLat)))
          }
        }
      })

      const units = lastUnits || ""
      // Report the color-scale range (global when fixed) so the legend matches
      // the colors and stays stable across frames.
      return { fc: { type: "FeatureCollection", features: outFeatures }, vMin: cMin, vMax: cMax, units }
    }

    // ---- Heatmap construction ----------------------------------------------

    // Build a continuous intensity wash from the same IDW raster the contours
    // use, rendered as a raster IMAGE (not GeoJSON polygons). Each raster cell
    // becomes one pixel in an RGBA canvas: COLOR from the shared ramp, ALPHA
    // scaling with intensity (transparent below a low-signal floor so quiet
    // areas show the basemap, like radar reflectivity). MapLibre draws it via
    // an `image` source with linear resampling, so it's smoothly interpolated
    // on the GPU — no visible blockiness and no per-feature tessellation.
    //
    // Returns { image: {data, width, height}, coordinates, vMin, vMax, units }
    // where `coordinates` is the image-source corner quad, or null.
    //
    // Below this fraction of the color span a pixel is fully transparent, so
    // light trace values don't haze the whole map.
    const HEATMAP_FLOOR = 0.04
    function buildHeatmap(points) {
      const field = buildField(points)
      if (!field) return null
      const { GRID, minLon, maxLon, minLat, maxLat, values, vMin, vMax } = field

      const FLAT_EPS = 1e-9
      if (!(vMax - vMin > FLAT_EPS)) {
        return { empty: true, vMin, vMax, units: lastUnits || "" }
      }

      const { cMin, cMax, cSpan } = colorScale(vMin, vMax)

      // Paint the full-resolution raster: one pixel per grid cell. Row 0 of
      // `values` is minLat (south), but image rows go top-down (north first),
      // so we write row gy into image row (GRID-1-gy) to flip vertically.
      const data = new Uint8ClampedArray(GRID * GRID * 4)
      for (let gy = 0; gy < GRID; gy++) {
        const imgRow = (GRID - 1 - gy)
        for (let gx = 0; gx < GRID; gx++) {
          const v = values[gy * GRID + gx]
          const o = (imgRow * GRID + gx) * 4
          if (!Number.isFinite(v)) { data[o + 3] = 0; continue }
          const raw = Math.max(0, Math.min(1, (v - cMin) / cSpan))
          if (raw < HEATMAP_FLOOR) { data[o + 3] = 0; continue }
          const t = COLOR_BUFFER + raw * (1 - 2 * COLOR_BUFFER)
          const [r, g, b] = rampRgbAt(t)
          // Alpha ramps with intensity (sqrt eases the low end up so light
          // snow is visible), capped below 1 so the basemap faintly shows
          // through even in the heaviest cells.
          const alpha = Math.min(0.85, 0.15 + 0.7 * Math.sqrt(raw))
          data[o] = r; data[o + 1] = g; data[o + 2] = b; data[o + 3] = Math.round(alpha * 255)
        }
      }

      // Image-source corner coordinates: [TL, TR, BR, BL] in lng/lat.
      const coordinates = [
        [minLon, maxLat], [maxLon, maxLat], [maxLon, minLat], [minLon, minLat],
      ]
      const units = lastUnits || ""
      return {
        image: { data, width: GRID, height: GRID },
        coordinates,
        vMin: cMin, vMax: cMax, units,
      }
    }
    // ---- Cursor readout -----------------------------------------------------
    let latestPoints = [], latestUnits = ""
    function sampleAt(plon, plat) {
      if (!latestPoints.length) return null
      let num = 0, den = 0
      for (const p of latestPoints) {
        const dLon = plon - p.lon, dLat = plat - p.lat
        const d2 = dLon * dLon + dLat * dLat
        if (d2 < 1e-12) return p.v
        const w = 1 / (d2 + IDW_EPS)
        num += w * p.v; den += w
      }
      return num / den
    }

    map.on("load", async () => {
      // Overlay sources + layers. The isoband overlay uses the `contours`
      // source (faint fill + strong lines). The heatmap overlay uses a raster
      // `image` source, created lazily on the first heatmap frame (MapLibre
      // image sources require a valid image + coordinates at creation, so they
      // can't be pre-created empty) and updated in place thereafter.
      map.addSource("contours", { type: 'geojson', data: { type: "FeatureCollection", features: [] } })
      map.addLayer({
        id: 'contours', type: 'fill', source: 'contours',
        layout: { visibility: isHeatmap ? 'none' : 'visible' },
        paint: { 'fill-color': ['get', 'fillColor'], 'fill-opacity': 0.03, 'fill-antialias': true }
      })
      map.addLayer({
        id: 'contour-lines', type: 'line', source: 'contours',
        layout: { 'line-join': 'round', visibility: isHeatmap ? 'none' : 'visible' },
        paint: { 'line-color': ['get', 'fillColor'], 'line-width': 1.6, 'line-opacity': 0.9 }
      })

      const mapContainer = document.getElementById("weatherRadar")
      const readoutEl = document.getElementById("cursorReadout")
      let cursorPx = null

      function refreshReadout() {
        if (!cursorPx) { readoutEl.style.display = "none"; return }
        const rect = mapContainer.getBoundingClientRect()
        const ll = map.unproject([cursorPx.x - rect.left, cursorPx.y - rect.top])
        const v = sampleAt(ll.lng, ll.lat)
        const valueText = v === null ? "—" : `${v.toFixed(1)}${latestUnits ? " " + latestUnits : ""}`
        readoutEl.innerHTML = `${model}: ${valueText}<br>${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`
        readoutEl.style.left = (cursorPx.x + 12) + "px"
        readoutEl.style.top = (cursorPx.y + 12) + "px"
        readoutEl.style.display = "block"
      }
      mapContainer.addEventListener("mousemove", (e) => { cursorPx = { x: e.clientX, y: e.clientY }; refreshReadout() })
      mapContainer.addEventListener("mouseleave", () => { cursorPx = null; readoutEl.style.display = "none" })
      map.on("move", () => { refreshReadout(); refreshPins() })

      // ---- Dropped pins -----------------------------------------------------
      // Persistent labels at fixed lat/lon showing the interpolated value,
      // updated each frame and repositioned on map move. Persisted in the URL
      // (`pins=lat,lon;lat,lon;...`) so a refresh restores them.
      const pinsContainer = document.getElementById("pins")
      let pins = [] // [{ lat, lon, el }]

      function serializePins() {
        const u = new URL(window.location.href)
        if (pins.length) {
          u.searchParams.set("pins", pins.map(p => `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`).join(";"))
        } else {
          u.searchParams.delete("pins")
        }
        history.replaceState(null, "", u.toString())
      }

      function addPin(plat, plon, persist = true) {
        // Marker: a pin icon anchored exactly at the point (tip at the spot).
        const marker = document.createElement("div")
        marker.textContent = "📍"
        marker.style.cssText = "position:fixed; z-index:101; transform:translate(-50%,-100%);" +
          "font-size:20px; line-height:1; cursor:pointer; user-select:none;" +
          "filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5));"
        // Info box: offset to the upper-right of the marker.
        const info = document.createElement("div")
        info.style.cssText = "position:fixed; z-index:101; transform:translate(0,-100%);" +
          "background:rgba(30,30,30,0.85); color:#fff; font-family:sans-serif; font-size:12px;" +
          "padding:3px 7px; border-radius:4px; white-space:nowrap; cursor:pointer;" +
          "box-shadow:0 1px 4px rgba(0,0,0,0.4);"

        const pin = { lat: plat, lon: plon, marker, info }
        const remove = (ev) => {
          ev.stopPropagation()
          const i = pins.indexOf(pin)
          if (i >= 0) { marker.remove(); info.remove(); pins.splice(i, 1); serializePins() }
        }
        marker.title = "Click to remove pin"
        info.title = "Click to remove pin"
        marker.addEventListener("click", remove)
        info.addEventListener("click", remove)

        pinsContainer.appendChild(marker)
        pinsContainer.appendChild(info)
        pins.push(pin)
        if (persist) serializePins()
        refreshPins()
      }

      // Reposition + re-read all pins (called on map move and each frame).
      // The marker sits on the point; the info box is offset to the
      // upper-right so it doesn't cover the location.
      const INFO_DX = 14, INFO_DY = -14
      function refreshPins() {
        const rect = mapContainer.getBoundingClientRect()
        for (const p of pins) {
          const pt = map.project([p.lon, p.lat])
          const x = rect.left + pt.x, y = rect.top + pt.y
          p.marker.style.left = x + "px"
          p.marker.style.top = y + "px"

          const v = sampleAt(p.lon, p.lat)
          const valueText = v === null ? "—" : `${v.toFixed(1)}${latestUnits ? " " + latestUnits : ""}`
          p.info.innerHTML = `${model}: ${valueText}<br>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`
          p.info.style.left = (x + INFO_DX) + "px"
          p.info.style.top = (y + INFO_DY) + "px"
        }
      }

      // Restore pins from the URL on load.
      ;(() => {
        const raw = new URL(window.location.href).searchParams.get("pins")
        if (!raw) return
        for (const part of raw.split(";")) {
          const [la, lo] = part.split(",").map(Number)
          if (Number.isFinite(la) && Number.isFinite(lo)) addPin(la, lo, false)
        }
      })()

      // Remove every pin (DOM + state) and clear them from the URL.
      function clearPins() {
        for (const p of pins) { p.marker.remove(); p.info.remove() }
        pins = []
        serializePins()
      }

      // Right-click context menu: "Center map here".
      const menuEl = document.getElementById("contextMenu")
      const ctxCoordsEl = document.getElementById("ctxCoords")
      let menuLngLat = null
      function hideMenu() { menuEl.style.display = "none" }
      map.on("contextmenu", (e) => {
        menuLngLat = e.lngLat
        ctxCoordsEl.textContent = `${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`
        menuEl.style.left = e.originalEvent.clientX + "px"
        menuEl.style.top = e.originalEvent.clientY + "px"
        menuEl.style.display = "block"
      })
      // "Drop pin here": leave a persistent value label at the clicked point.
      document.getElementById("ctxDropPin").addEventListener("click", () => {
        if (!menuLngLat) return
        addPin(menuLngLat.lat, menuLngLat.lng)
        hideMenu()
      })
      // "See graph": open the forecast graph for this location in a new tab.
      // The graph's `models` param maps model-type -> [attribute], e.g.
      // {"observation": ["temperature"]}.
      document.getElementById("ctxSeeGraph").addEventListener("click", () => {
        if (!menuLngLat) return
        const models = JSON.stringify({ [kind]: [model] })
        const u = new URL("/graph/", window.location.origin)
        u.searchParams.set("models", models)
        u.searchParams.set("lat", menuLngLat.lat.toFixed(6))
        u.searchParams.set("lon", menuLngLat.lng.toFixed(6))
        hideMenu()
        window.open(u.toString(), "_blank")
      })
      // Shared reload for both "Center map here" and "Capture area". It sizes
      // the measured area to the current viewport and reloads the data, color
      // range, and playback window for it. When `recenter` is a {lat, lon} the
      // map pans there first and that point becomes the new area center;
      // otherwise ("Capture area") the current map center/view is used as-is.
      async function loadArea({ recenter = null } = {}) {
        if (recenter) {
          lat = recenter.lat
          lon = recenter.lon
        } else {
          const c = map.getCenter()
          lat = c.lat
          lon = c.lng
        }

        // Moving to a new area invalidates existing pins.
        clearPins()

        // Size the fetched area to the current viewport so the contour field
        // covers the whole window. The map's lat/lon span (in degrees) is
        // converted to km mirroring the server geometry: width drives the
        // lon-span, height the lat-span. (Pan doesn't change the span, only
        // the center, so reading bounds now is correct for the new view.)
        const b = map.getBounds()
        width = Math.abs(b.getEast() - b.getWest()) * 110.574
        height = Math.abs(b.getNorth() - b.getSouth()) * (111.320 * Math.cos(lat * Math.PI / 180))

        // Pan to the new center when recentering (keep current zoom); "Capture
        // area" keeps the current view. Either way, sync the URL in place — no
        // page reload.
        if (recenter) map.easeTo({ center: [lon, lat], duration: 500 })
        const u = new URL(window.location.href)
        u.searchParams.set("lat", lat.toFixed(6))
        u.searchParams.set("lon", lon.toFixed(6))
        u.searchParams.set("width", width.toFixed(2))
        u.searchParams.set("height", height.toFixed(2))
        u.searchParams.set("zoom", map.getZoom().toFixed(2))
        // Re-centering starts a fresh playback window for the new area; drop
        // any persisted scrubber state so it doesn't carry over.
        u.searchParams.delete("from")
        u.searchParams.delete("to")
        u.searchParams.delete("t")
        history.replaceState(null, "", u.toString())

        // Reset the animation clock to "now" and reload for the new area:
        // cache its data, recompute the fixed color range, then render.
        time = Math.floor(Date.now() / 1000)
        globalMin = null; globalMax = null
        forecastStart = null; forecastEnd = null
        windowStart = null; windowEnd = null
        mapTimeZone = null
        scrubberReady = false
        // Invalidate any in-flight frame load from the previous area so a
        // stale result can't render over the new one. The `loading` flag gates
        // the animation tick (it keeps looping but won't render) until the new
        // area is ready, so we don't need to pause/resume playback.
        loadGeneration += 1
        loading = true
        // New area: drop the previous area's cached API responses so the
        // client cache doesn't grow unbounded or serve stale frames.
        apiClient.clear()
        // Clear the old area's overlay immediately so stale geometry isn't
        // left on screen while the new area loads.
        lastFeatures = []
        if (isHeatmap) {
          // Blank the raster image if it exists yet (nothing to do otherwise).
          if (heatReady) showHeatmap({ empty: true })
        } else {
          const src = map.getSource("contours")
          if (src) src.setData({ type: "FeatureCollection", features: [] })
        }
        showSpinner("Loading data…")
        try {
          await prefetchWithProgress()
          await fetchGlobalRange()
          time = clampToForecast(time)
          showSpinner("Rendering…")
          await loadFrame(time)
        } catch (err) {
          console.error("area load failed:", err)
        } finally {
          loading = false
          hideSpinner()
          // A recenter ALWAYS autoplays the new area, even if playback was
          // paused beforehand. A tick from the OLD area may still be parked in
          // loadFrame; reset the running flag so the new loop isn't blocked
          // waiting on it (its stale result is discarded by the loadGeneration
          // check anyway). setPaused(false) clears any paused state and kicks
          // the (idempotent) loop; if already playing it still (re)starts one
          // clean loop via the explicit scheduleNext below.
          tickRunning = false
          setPaused(false)
          scheduleNext()
        }
        // Stream the new area's window into the cache in the background.
        fillCache()
      }
      document.getElementById("ctxCenterHere").addEventListener("click", () => {
        if (!menuLngLat) return
        const target = { lat: menuLngLat.lat, lon: menuLngLat.lng }
        hideMenu()
        loadArea({ recenter: target })
      })
      // "Capture area": make the current map view the area to measure (keep
      // the current center, size the area to the viewport).
      document.getElementById("ctxCaptureArea").addEventListener("click", () => {
        hideMenu()
        loadArea()
      })
      map.on("click", hideMenu)
      map.on("movestart", hideMenu)
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") hideMenu() })

      // ---- Rendering --------------------------------------------------------

      // Heatmap raster plumbing. We paint the field into an offscreen canvas
      // and show it via a MapLibre `image` source (lazily created on first
      // use, then updated in place). Linear resampling lets the GPU smoothly
      // interpolate the raster so it doesn't look blocky.
      const heatCanvas = document.createElement("canvas")
      const heatCtx = heatCanvas.getContext("2d")
      let heatReady = false  // true once the image source + layer exist
      let lastHeatCoords = null  // most recent image corner quad (for blanking)

      function paintHeatImage(info) {
        const { data, width, height } = info.image
        if (heatCanvas.width !== width) heatCanvas.width = width
        if (heatCanvas.height !== height) heatCanvas.height = height
        heatCtx.putImageData(new ImageData(data, width, height), 0, 0)
        return heatCanvas.toDataURL()
      }

      function showHeatmap(info) {
        // Empty/flat frame: blank the existing image (if any) by uploading a
        // fully transparent raster at the last known size/coords. Cheaper than
        // remove/re-add of the source/layer every blank frame.
        if (info.empty || !info.image) {
          if (heatReady && lastHeatCoords) {
            const w = heatCanvas.width || 1, h = heatCanvas.height || 1
            heatCtx.clearRect(0, 0, w, h)
            map.getSource("heatmap").updateImage({
              url: heatCanvas.toDataURL(),
              coordinates: lastHeatCoords,
            })
          }
          return
        }
        const url = paintHeatImage(info)
        lastHeatCoords = info.coordinates
        if (!heatReady) {
          map.addSource("heatmap", { type: "image", url, coordinates: info.coordinates })
          // Insert ABOVE the basemap but below labels where possible. Simplest
          // robust placement: add on top (labels in positron are drawn by the
          // basemap style; the semi-transparent wash keeps them legible).
          map.addLayer({
            id: "heatmap", type: "raster", source: "heatmap",
            paint: { "raster-opacity": 1, "raster-resampling": "linear", "raster-fade-duration": 0 },
          })
          heatReady = true
        } else {
          map.getSource("heatmap").updateImage({ url, coordinates: info.coordinates })
        }
      }

      // Render one frame's points. `points` is a flat array of {lon, lat, v}
      // (produced by normalizeFrame from either wire shape). `uom` is the
      // frame's unit; when omitted (e.g. a re-render triggered by a legend
      // change) the last known unit is reused.
      function renderFeatures(points, uom) {
        lastFeatures = points
        if (uom !== undefined) lastUnits = uom
        latestPoints = points.filter(p => Number.isFinite(p.v))
        latestUnits = points.length ? (lastUnits || "") : ""

        // Now that units are known, make sure the contour-interval label shows
        // them (e.g. "2 mm" instead of a placeholder degree symbol).
        const stepLbl = document.getElementById("stepLabel")
        if (stepLbl) stepLbl.textContent = formatStep(contourStep)

        if (isHeatmap) {
          const info = buildHeatmap(points)
          if (info) {
            showHeatmap(info)
            updateLegend(info.vMin, info.vMax, info.units)
          }
        } else {
          const info = buildContours(points)
          if (info) {
            map.getSource("contours").setData(info.fc)
            updateLegend(info.vMin, info.vMax, info.units)
          }
        }
        // Keep the cursor readout and dropped pins in sync with the new
        // frame's data.
        refreshReadout()
        refreshPins()
      }

      // --- Caching API client ------------------------------------------------
      // A thin wrapper over fetch() that caches parsed JSON responses. Callers
      // request a URL (with an optional explicit cache key); if we already have
      // the data cached, it's returned immediately with NO network call. It
      // also deduplicates in-flight requests — two callers asking for the same
      // key while a fetch is pending share that one fetch (so the animation
      // loop and a timeline scrub won't double-fetch the same frame).
      //
      // The cache is scoped to the current area: apiClient.clear() is called on
      // re-center so stale frames from a previous location are dropped.
      const apiClient = (() => {
        const cache = new Map()      // key -> parsed JSON (resolved value)
        const inflight = new Map()   // key -> Promise<parsed JSON>
        const waiters = new Map()    // key -> [resolve, ...] awaiting a put()

        async function getJson(url, cacheKey) {
          const key = cacheKey || url
          if (cache.has(key)) return cache.get(key)        // hit: no network
          if (inflight.has(key)) return inflight.get(key)  // coalesce duplicates
          const p = (async () => {
            const resp = await fetch(url)
            if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`)
            const data = await resp.json()
            put(key, data)
            return data
          })()
          inflight.set(key, p)
          try {
            return await p
          } finally {
            inflight.delete(key)
          }
        }

        function put(key, data) {
          cache.set(key, data)
          // Wake anyone awaiting this key (e.g. the render path waiting for the
          // cache-fill to deliver a frame).
          const ws = waiters.get(key)
          if (ws) {
            waiters.delete(key)
            for (const r of ws) r(data)
          }
        }

        // Resolve when `key` is put into the cache (or immediately if already
        // present). With a positive `timeout` (ms) it resolves `null` if the
        // key hasn't arrived by then; with timeout <= 0 it waits INDEFINITELY
        // (until a put(), or until clear() releases all waiters with null on a
        // re-center). Lets the render path hold the current frame until the
        // streaming cache-fill delivers the requested one.
        function waitFor(key, timeout) {
          if (cache.has(key)) return Promise.resolve(cache.get(key))
          return new Promise((resolve) => {
            const arr = waiters.get(key) || []
            arr.push(resolve)
            waiters.set(key, arr)
            if (timeout > 0) {
              setTimeout(() => {
                const cur = waiters.get(key)
                if (cur) {
                  const i = cur.indexOf(resolve)
                  if (i >= 0) cur.splice(i, 1)
                  if (!cur.length) waiters.delete(key)
                }
                resolve(cache.get(key) || null)
              }, timeout)
            }
          })
        }

        // Release every pending waiter with `null` (used by clear() so a
        // re-center doesn't leave a loadFrame awaiting a frame that will never
        // come from the old area).
        function releaseWaiters() {
          for (const arr of waiters.values()) {
            for (const r of arr) r(null)
          }
          waiters.clear()
        }

        // Release waiters for a specific key with `null` (used when a fill
        // ends without ever delivering that key — e.g. the server skipped an
        // empty/errored frame — so a waiting loadFrame doesn't hang forever).
        function releaseKey(key) {
          const arr = waiters.get(key)
          if (!arr) return
          waiters.delete(key)
          for (const r of arr) r(null)
        }

        return {
          getJson,
          put,
          waitFor,
          releaseKey,
          has: (key) => cache.has(key),
          clear: () => { cache.clear(); inflight.clear(); releaseWaiters() },
          size: () => cache.size,
        }
      })()

      // Shared cache key for an ensemble frame. Omits dt: the server's
      // per-frame prediction depends only on the concrete `time`, so a frame
      // produced under one dt is reusable under another (scrubbing, looping, or
      // changing the step all hit cache). Both loadFrame and the cache-fill use
      // this so they share entries.
      function frameCacheKey(t) {
        return `ensemble|${model}|${kind}|${lat}|${lon}|${width}|${height}|${t}`
      }

      // Normalize a cached frame into a flat points array [{lon, lat, v}] plus
      // its unit, accepting EITHER wire shape:
      //   * slim (series/stream): { time, uom, coords:[[c0,c1],...], vals:[...] }
      //   * GeoJSON (one-shot /ensemble, and the empty negative-cache entry):
      //     { type:"FeatureCollection", features:[{geometry:{coordinates:[c0,c1]},
      //       properties:{[model]:v, uom}}] }
      // Coordinate order is preserved EXACTLY as before (c0 -> lon slot, c1 ->
      // lat slot) so rendering is unchanged — this is purely a payload slimming.
      function normalizeFrame(data) {
        if (!data) return { points: [], uom: "" }
        if (Array.isArray(data.vals) && Array.isArray(data.coords)) {
          const pts = []
          const co = data.coords, vs = data.vals
          for (let i = 0; i < co.length; i++) {
            const v = vs[i]
            if (v === null || v === undefined || !Number.isFinite(v)) continue
            pts.push({ lon: co[i][0], lat: co[i][1], v })
          }
          return { points: pts, uom: data.uom || "" }
        }
        // GeoJSON FeatureCollection fallback.
        const feats = data.features || []
        const pts = feats.map(f => ({
          lon: f.geometry.coordinates[0],
          lat: f.geometry.coordinates[1],
          v: f.properties[model],
        })).filter(p => Number.isFinite(p.v))
        return { points: pts, uom: feats.length ? (feats[0].properties.uom || "") : "" }
      }

      // Snap an epoch onto the frame grid. The grid is anchored at
      // `forecastStart` (the NOAA spline-intersection start returned by the
      // range API) and stepped by dt, so the lattice phase is STABLE across
      // scrubs, dt changes, and window adjustments within a view — a given
      // instant always maps to the same tick, which is what makes the frame
      // cache usable. The cache-fill produces only these grid-aligned frames,
      // so loadFrame MUST render grid-aligned times too — otherwise it would
      // wait on a cache key the fill never delivers and hang.
      //
      // Note: the grid phase is anchored to forecastStart, but the result is
      // CLAMPED into the active playback window [windowStart, windowEnd]. The
      // window bounds the playable range; forecastStart fixes the phase.
      function snapToGrid(t) {
        const anchor = forecastStart !== null ? forecastStart
                     : (windowStart !== null ? windowStart : null)
        const lo = windowStart !== null ? windowStart
                 : (forecastStart !== null ? forecastStart : null)
        const hi = windowEnd !== null ? windowEnd
                 : (forecastEnd !== null ? forecastEnd : null)
        const step = dt > 0 ? dt : 3600
        if (anchor === null || !Number.isFinite(t)) return t
        let snapped = anchor + Math.round((t - anchor) / step) * step
        // Clamp into the window on the same lattice (ceil at lo, floor at hi so
        // the clamped value is still a grid tick).
        if (lo !== null && snapped < lo) snapped = anchor + Math.ceil((lo - anchor) / step) * step
        if (hi !== null && snapped > hi) snapped = anchor + Math.floor((hi - anchor) / step) * step
        return snapped
      }

      // Monotonic counter so that when several loadFrame() calls are waiting on
      // the cache at once (e.g. a fast scrub across uncached frames), only the
      // most recently requested one renders — an earlier wait that resolves
      // late can't paint a stale frame over a newer one.
      let frameSeq = 0

      // Render a frame for the given time STRICTLY from the cache. The client
      // never fetches a single frame directly — all frames arrive via the
      // streaming cache-fill (fillCache). On a cache miss we (re)compute what
      // the window still needs and kick off a stream to fill it, then wait for
      // THIS frame to land in the cache, holding the currently-rendered frame
      // in the meantime (so the map never blanks out on a miss).
      //
      // This miss-driven kick is the whole re-targeting mechanism: e.g. when
      // the playhead loops back to the window start, that first frame is a
      // miss, which recomputes the missing set and streams it.
      async function loadFrame(time) {
        // Snap to the frame grid so the key we wait on matches a frame the fill
        // actually produces (the fill only emits grid-aligned times).
        time = snapToGrid(time)
        // Capture the current load generation; a re-center bumps it, so a
        // frame we were waiting on across a re-center won't render its (now
        // stale) result over the new area.
        const gen = loadGeneration
        const seq = ++frameSeq
        const cacheKey = frameCacheKey(time)

        let data = apiClient.has(cacheKey) ? apiClient.getJson(null, cacheKey) : null
        if (data === null) {
          // Miss: hold the current frame and wait for the single streaming
          // fill to deliver this one. Poll in bounded slices (not an indefinite
          // wait) so we can detect supersession and never deadlock the tick:
          //   * if no fill is running, kick one anchored at THIS time (its
          //     stream starts at this frame, so it arrives first);
          //   * if a fill is running, trust it and keep waiting;
          //   * bail if a re-center (loadGeneration) or newer frame request
          //     (frameSeq) supersedes us.
          for (;;) {
            if (!fillActive) fillCache(time)
            data = await apiClient.waitFor(cacheKey, 1500)
            if (data) break
            if (gen !== loadGeneration || seq !== frameSeq) return false
            if (apiClient.has(cacheKey)) { data = await apiClient.getJson(null, cacheKey); break }
          }
        } else {
          data = await data
        }
        if (gen !== loadGeneration) return false  // superseded by a re-center
        if (seq !== frameSeq) return false        // a newer frame was requested
        if (!data) return false                   // fill superseded / aborted
        const frame = normalizeFrame(data)
        renderFeatures(frame.points, frame.uom)
        syncTimeSlider(time)
        return true
      }

      // --- Cache fill: stream the window into the cache ----------------------
      // The SINGLE path by which frames enter the cache. Given the current
      // window + dt, it inventories which grid times are still uncached and
      // streams exactly those (and no more) via the combined batch+sequence
      // endpoint. The contour map (loadFrame) only ever READS the cache; a
      // miss there kicks this off. Recomputed on load / re-center / dt-change /
      // scrub, and whenever loadFrame hits a miss (e.g. looping back to start).
      //
      // Grid: anchored at `lo` (window start), stepped by `dt`, covering
      // lo..hi. The frame cache key is dt-INDEPENDENT, so instants shared
      // across two dt values are reused: e.g. filled 0,15,30,45,60 at dt=15,
      // then switching to dt=10 only needs 10,20,40,50,... (0 and 30 are hits).
      //
      // The uncached grid times are split for the endpoint:
      //   * SEQUENCE = the final contiguous uncached run, sent as start/end,
      //                streamed in order.
      //   * BATCH    = every other uncached time before that run (scattered
      //                gaps), sent as `times=`, streamed first, nearest to the
      //                current playhead first.
      // Superseded via a token + AbortController so only the latest fill
      // populates the cache.
      // Fill the cache in ONE streaming request per sweep. `fromTime` anchors
      // the pivot (defaults to the live playhead). The request covers the
      // contiguous uncached run FORWARD from the pivot to the window end (play
      // order), or — if everything ahead is cached — the contiguous uncached
      // run behind the pivot. The server streams frames incrementally, so the
      // client renders the pivot first and the rest arrives in order; no
      // chunking/chaining, so one sweep = one request (minimal per-request
      // overhead). Strictly single-flight: each call bumps fillToken and aborts
      // the prior stream at entry, so a scrub / loadFrame miss / re-aim always
      // supersedes — the abort stops the server after at most one more frame.
      let fillToken = 0
      let fillAbort = null
      let fillActive = false

      function stopFill() {
        fillActive = false
        if (fillAbort) { try { fillAbort.abort() } catch (_) {} fillAbort = null }
      }

      function fillCache(fromTime) {
        // Supersede any in-flight fill immediately (single-flight).
        const myToken = ++fillToken
        const gen = loadGeneration
        stopFill()

        if (forecastStart === null || forecastEnd === null) return
        const lo = windowStart !== null ? windowStart : forecastStart
        const hi = windowEnd !== null ? windowEnd : forecastEnd
        const step = dt > 0 ? dt : 3600
        if (lo > hi) return

        // Frame lattice is anchored at forecastStart (NOT lo), matching
        // snapToGrid, so the pivot and inventory ticks are identical to the
        // ones loadFrame waits on. The first tick inside the window is the
        // ceil of lo onto that lattice.
        const gridAnchor = forecastStart
        const firstTick = gridAnchor + Math.ceil((lo - gridAnchor) / step) * step

        // Pivot: the requested time snapped onto the (forecastStart) lattice
        // and clamped to the window — reuse snapToGrid so there is exactly one
        // definition of "which tick".
        const anchor = Number.isFinite(fromTime) ? fromTime : time
        const pivot = snapToGrid(Number.isFinite(anchor) ? anchor : lo)

        // Inventory the window grid (forecastStart-anchored); collect uncached
        // times.
        const uncached = []
        for (let t = firstTick; t <= hi; t += step) {
          if (!apiClient.has(frameCacheKey(t))) uncached.push(t)
        }
        if (!uncached.length) return  // whole window already cached

        // Build ONE request covering ALL uncached frames in the window, split
        // into two parts the server combines:
        //   * SEQUENCE (start/end) = the contiguous run from the pivot forward,
        //     streamed in play order so the frame the user is on arrives first.
        //   * BATCH (times=) = every OTHER uncached frame (before the pivot, or
        //     the scattered gaps that appear when dt changes — e.g. switching
        //     30min->15min leaves the new 15min slots isolated between cached
        //     30min slots). Ordered nearest-the-pivot first.
        // This consolidates what would otherwise be many single-frame requests
        // (each isolated gap) into a single stream. The server's 5000-frame cap
        // bounds pathological windows.
        let fwdStart = null
        for (const t of uncached) {
          if (t >= pivot) { fwdStart = t; break }
        }

        let seqStart, seqHi
        if (fwdStart !== null) {
          seqStart = fwdStart
          seqHi = fwdStart
          for (let t = fwdStart + step; t <= hi; t += step) {
            if (apiClient.has(frameCacheKey(t))) break  // contiguous run only
            seqHi = t
          }
        } else {
          const runEnd = uncached[uncached.length - 1]  // largest uncached < pivot
          let runStart = runEnd
          for (let t = runEnd - step; t >= lo; t -= step) {
            if (apiClient.has(frameCacheKey(t))) break
            runStart = t
          }
          seqStart = runStart
          seqHi = runEnd
        }

        // Batch = all uncached frames NOT already covered by the sequence run,
        // nearest-the-pivot first (so gaps near the playhead fill soonest).
        const batch = uncached
          .filter((t) => t < seqStart || t > seqHi)
          .sort((a, b) => Math.abs(a - pivot) - Math.abs(b - pivot))

        const ctrl = new AbortController()
        fillAbort = ctrl

        const qs = [
          `lat=${lat}`, `lon=${lon}`, `width=${width}`, `height=${height}`,
          `kind=${kind}`, `dt=${step}`,
          `start=${seqStart}`, `end=${seqHi}`,
        ]
        if (batch.length) qs.push(`times=${batch.join(",")}`)
        const url = `/api/models/${model}/type/series/stream?${qs.join("&")}`
        console.log(`[fill] seq=${seqStart}..${seqHi} batch=${batch.length} uncached=${uncached.length} pivot=${pivot}`)

        // Every uncached frame this request is responsible for (sequence run +
        // batch). On completion, any still-missing one is negative-cached as
        // empty so it isn't re-requested forever.
        const targetTimes = uncached.slice()

        fillActive = true
        ;(async () => {
          let completed = false
          try {
            let resp
            try {
              resp = await fetch(url, { signal: ctrl.signal })
            } catch (_) { return }
            if (!resp || !resp.ok || !resp.body) return
            const reader = resp.body.getReader()
            const decoder = new TextDecoder()
            let buffer = ""
            const handle = (line) => {
              if (!line) return
              try {
                const fr = JSON.parse(line)
                if (gen === loadGeneration && myToken === fillToken) {
                  // Slim wire format: cache the frame record itself
                  // ({time, uom, coords, vals}). normalizeFrame() lets the
                  // render path consume this or a GeoJSON FeatureCollection
                  // (the one-shot /ensemble endpoint still returns GeoJSON).
                  apiClient.put(frameCacheKey(fr.time), fr)
                }
              } catch (_) {}
            }
            for (;;) {
              if (gen !== loadGeneration || myToken !== fillToken) {
                try { reader.cancel() } catch (_) {}
                return
              }
              let readChunk
              try { readChunk = await reader.read() } catch (_) { return }
              if (readChunk.done) break
              buffer += decoder.decode(readChunk.value, { stream: true })
              let nl
              while ((nl = buffer.indexOf("\n")) >= 0) {
                handle(buffer.slice(0, nl).trim())
                buffer = buffer.slice(nl + 1)
              }
            }
            handle(buffer.trim())
            completed = true  // stream read to completion (not aborted)
          } finally {
            if (myToken === fillToken) {
              fillActive = false
              if (completed) {
                // NEGATIVE-CACHE skipped frames (only on a fully-read stream,
                // never on abort/supersede — an aborted sweep hasn't proven
                // those frames empty). The server omits a frame when it has no
                // features (e.g. accumulation models early in the window with
                // zero precip, or all gridpoints out of horizon). Without this,
                // those grid slots stay "uncached" forever and every sweep
                // re-requests them one-by-one (start==end) in an endless
                // single-frame storm. Caching an empty FeatureCollection marks
                // the slot filled: the contiguous-run logic skips it and
                // loadFrame renders an empty frame. Correct for ALL kinds.
                for (const t of targetTimes) {
                  const k = frameCacheKey(t)
                  if (!apiClient.has(k)) {
                    apiClient.put(k, { type: "FeatureCollection", features: [] })
                  }
                }
              } else {
                // Aborted/superseded: just release waiters so a parked
                // loadFrame doesn't hang; do NOT negative-cache.
                for (const t of targetTimes) {
                  const k = frameCacheKey(t)
                  if (!apiClient.has(k)) apiClient.releaseKey(k)
                }
              }
            }
          }
        })()
      }

      // Stream prefetch progress from NOAA and drive the spinner with a live
      // completed/total fraction per phase (resolving grid, then fetching
      // data). Resolves once the area is fully cached. Falls back to the plain
      // (blocking, no-progress) prefetch if streaming isn't available.
      async function prefetchWithProgress() {
        const url = `/api/models/prefetch/stream?lat=${lat}&lon=${lon}&width=${width}&height=${height}`
        let resp
        try {
          resp = await fetch(url)
        } catch (err) {
          resp = null
        }
        if (!resp || !resp.ok || !resp.body) {
          // Fallback: blocking prefetch with a generic message.
          showSpinner("Loading data…")
          await fetch(`/api/models/prefetch?lat=${lat}&lon=${lon}&width=${width}&height=${height}`)
          return
        }
        const reader = resp.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ""
        const handle = (line) => {
          if (!line) return
          try {
            const p = JSON.parse(line)
            setSpinnerProgress(p.phase, p.done, p.total)
          } catch (_) {}
        }
        for (;;) {
          const { value, done } = await reader.read()
          if (done) break
          buffer += decoder.decode(value, { stream: true })
          let nl
          while ((nl = buffer.indexOf("\n")) >= 0) {
            handle(buffer.slice(0, nl).trim())
            buffer = buffer.slice(nl + 1)
          }
        }
        handle(buffer.trim())
      }

      // Fetch the fixed global value range for the current area (whole
      // forecast lifecycle) so colors/legend stay stable across frames.
      // Safe to call after /prefetch.
      async function fetchGlobalRange() {
        try {
          const resp = await fetch(
            `/api/models/${model}/type/range?lat=${lat}&lon=${lon}&width=${width}&height=${height}&kind=${kind}`
          )
          const r = await resp.json()
          if (r && Number.isFinite(r.min) && Number.isFinite(r.max) && r.max > r.min) {
            globalMin = r.min; globalMax = r.max
            console.log("[field] global range:", globalMin.toFixed(1), "-", globalMax.toFixed(1), r.uom)
            // Auto-scale the contour interval to the range (unless the user
            // has pinned a step manually / via URL).
            if (autoStep) applyAutoStep()
          }
          // The map center's IANA timezone, so times display in the location's
          // local zone rather than the browser's. Falls back to browser-local.
          mapTimeZone = (r && r.timeZone) || null
          // Capture the forecast window; default the playback window to it,
          // then apply any persisted window/time from the URL (clamped into
          // the available forecast range).
          const s = r && r.start ? Math.floor(Date.parse(r.start) / 1000) : NaN
          const e = r && r.end ? Math.floor(Date.parse(r.end) / 1000) : NaN
          if (Number.isFinite(s) && Number.isFinite(e) && e > s) {
            forecastStart = s; forecastEnd = e
            windowStart = s; windowEnd = e
            applyUrlWindow()
            console.log("[field] forecast window:", new Date(s * 1000).toISOString(), "->", new Date(e * 1000).toISOString())
            configureScrubber()
          }
        } catch (err) {
          console.warn("global range fetch failed; using per-frame range:", err)
        }
      }

      // Clamp a time (epoch seconds) into the active playback window if known,
      // so the first frame after a (re)load always falls on valid data.
      function clampToForecast(t) {
        if (windowStart !== null && t < windowStart) return windowStart
        if (windowEnd !== null && t > windowEnd) return windowStart !== null ? windowStart : t
        return t
      }

      // ---- Animation over time ---------------------------------------------
      // Each frame advances model time by `dt`. The next frame is scheduled
      // only after the current one finishes, so slow frames don't stack up.
      const BASE_FRAME_INTERVAL_MS = 1000
      let playbackSpeed = {{playback_speed}}
      let paused = false
      let tickTimer = null
      let tickRunning = false
      let time = Math.floor(Date.now() / 1000)
      // Bumped whenever we switch areas (re-center), so in-flight frame loads
      // from the previous area can detect they've been superseded and skip
      // rendering stale contours over the new location.
      let loadGeneration = 0
      // True while a (re)load is in progress. The animation tick refuses to
      // run while this is set, so the old area's frames can't keep animating
      // underneath the loading spinner.
      let loading = false

      function frameIntervalMs() {
        // Floor of 20ms (=50x at the 1s base) so the top speeds aren't clamped
        // to the same interval. Actual throughput is still bounded by per-frame
        // render time; the loop schedules the next frame only after the current
        // one finishes, so frames can't stack up regardless.
        return Math.max(20, BASE_FRAME_INTERVAL_MS / playbackSpeed)
      }
      // Discrete speed ladder the +/- buttons step through. Includes the
      // requested 20x and 50x at the top end.
      const SPEED_STEPS = [0.25, 0.5, 1, 2, 5, 10, 20, 50]
      function stepSpeed(dir) {
        // Snap current speed to the nearest ladder index, then move one step.
        let i = 0, best = Infinity
        for (let k = 0; k < SPEED_STEPS.length; k++) {
          const d = Math.abs(SPEED_STEPS[k] - playbackSpeed)
          if (d < best) { best = d; i = k }
        }
        i = Math.max(0, Math.min(SPEED_STEPS.length - 1, i + dir))
        setPlaybackSpeed(SPEED_STEPS[i])
      }
      function setPlaybackSpeed(mult) {
        playbackSpeed = Math.max(0.1, Math.min(mult, 50))
        const lbl = document.getElementById("speedLabel")
        if (lbl) lbl.textContent = playbackSpeed.toFixed(1) + "×"
        const u = new URL(window.location.href)
        u.searchParams.set("speed", playbackSpeed.toFixed(2))
        history.replaceState(null, "", u.toString())
      }
      function updatePlayPauseButton() {
        const btn = document.getElementById("playPause")
        if (btn) { btn.textContent = paused ? "▶" : "⏸"; btn.title = paused ? "Play" : "Pause" }
      }
      function setPaused(p) {
        if (p === paused) return
        paused = p
        updatePlayPauseButton()
        if (!paused) { // resume: cancel stray timer, kick the loop
          if (tickTimer) { clearTimeout(tickTimer); tickTimer = null }
          scheduleNext()
        } else if (!scrubbing) {
          // Pausing to a resting state: capture the current time in the URL.
          // (During a scrub, endDrag handles persistence instead.)
          persistScrubberState()
        }
      }
      function scheduleNext() {
        if (paused) return
        // Idempotent: never leave two timers pending. Any caller (tick finally,
        // setPaused, recenter) can call this freely; there is always at most
        // one scheduled tick.
        if (tickTimer) { clearTimeout(tickTimer); tickTimer = null }
        tickTimer = window.setTimeout(tick, frameIntervalMs())
      }

      // Time-step (dt) control. Steps through a preset list of nice durations.
      const DT_PRESETS = [300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400] // seconds
      function formatDt(secs) {
        if (secs < 3600) return (secs / 60) + "m"
        const h = secs / 3600
        return (Number.isInteger(h) ? h : h.toFixed(1)) + "h"
      }
      function setDt(secs) {
        dt = Math.max(DT_PRESETS[0], Math.min(secs, DT_PRESETS[DT_PRESETS.length - 1]))
        const lbl = document.getElementById("dtLabel")
        if (lbl) lbl.textContent = formatDt(dt)
        const u = new URL(window.location.href)
        u.searchParams.set("dt", String(dt))
        history.replaceState(null, "", u.toString())
        // The frame grid changed; recompute the cache fill for the new dt's
        // times (cached instants that overlap are reused via the shared
        // dt-independent key — this is exactly the batch+sequence case).
        fillCache()
      }
      function stepDt(dir) {
        // Move to the neighboring preset (dir = +1 bigger, -1 smaller).
        let i = DT_PRESETS.findIndex(v => v >= dt)
        if (i < 0) i = DT_PRESETS.length - 1
        // If current dt isn't exactly a preset, snap toward the requested dir.
        if (DT_PRESETS[i] !== dt && dir < 0) i -= 1
        const next = Math.max(0, Math.min(i + dir, DT_PRESETS.length - 1))
        setDt(DT_PRESETS[next])
      }

      // Contour interval control. Steps through preset deltas, labeled in the
      // model's own units (° for temperature, mm for precip/snow, etc.).
      const STEP_PRESETS = [0.25, 0.5, 1, 2, 5, 10, 20]
      // Derive the step-label unit suffix from the current data's units.
      // Temperature-like units render as a degree symbol; everything else gets
      // a space-separated unit (e.g. "mm"). Falls back to "°" before the first
      // frame's units are known.
      function stepUnitSuffix() {
        const u = (latestUnits || "").toLowerCase()
        if (!u) return "\u00b0"
        if (u === "degf" || u === "degc" || u === "f" || u === "c") return "\u00b0"
        return " " + latestUnits
      }
      function formatStep(s) {
        // Trim to at most 2 decimals, dropping trailing zeros.
        const n = Math.round(s * 100) / 100
        return (Number.isInteger(n) ? n : n) + stepUnitSuffix()
      }

      // Snap a raw interval to a "nice" number: {1, 2, 2.5, 5, 10} x 10^n.
      // Keeps contour intervals human-friendly regardless of the data range.
      function niceStep(raw) {
        if (!(raw > 0)) return 1
        const mag = Math.pow(10, Math.floor(Math.log10(raw)))
        const norm = raw / mag // in [1, 10)
        let nice
        if (norm < 1.5) nice = 1
        else if (norm < 3) nice = 2
        else if (norm < 4) nice = 2.5
        else if (norm < 7.5) nice = 5
        else nice = 10
        return nice * mag
      }

      // Auto-scale the contour interval to the global value range, targeting a
      // readable number of bands. Does not touch the URL or the autoStep flag
      // (it IS the auto behavior). Re-renders the current frame.
      const TARGET_BANDS = 10
      function applyAutoStep() {
        if (globalMin === null || globalMax === null) return
        const range = globalMax - globalMin
        if (!(range > 0)) return
        contourStep = niceStep(range / TARGET_BANDS)
        const lbl = document.getElementById("stepLabel")
        if (lbl) lbl.textContent = formatStep(contourStep)
        if (lastFeatures.length) renderFeatures(lastFeatures)
      }

      // Set the interval from an explicit user action: pins the value, records
      // it in the URL, and disables auto-scaling so the choice sticks.
      function setContourStep(s) {
        contourStep = Math.max(0.05, Math.min(s, 100))
        autoStep = false
        const lbl = document.getElementById("stepLabel")
        if (lbl) lbl.textContent = formatStep(contourStep)
        const u = new URL(window.location.href)
        u.searchParams.set("step", String(contourStep))
