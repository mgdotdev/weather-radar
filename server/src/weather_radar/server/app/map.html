        history.replaceState(null, "", u.toString())
      }
      function stepContour(dir) {
        // Cycle through the presets relative to the current step.
        let i = STEP_PRESETS.findIndex(v => v >= contourStep - 1e-9)
        if (i < 0) i = STEP_PRESETS.length - 1
        if (STEP_PRESETS[i] > contourStep + 1e-9 && dir < 0) i -= 1
        const next = Math.max(0, Math.min(i + dir, STEP_PRESETS.length - 1))
        setContourStep(STEP_PRESETS[next]) // manual -> disables autoStep
        // Re-render the current frame immediately with the new interval.
        if (lastFeatures.length) renderFeatures(lastFeatures)
      }

      // ---- Custom time scrubber --------------------------------------------
      // An SVG with three draggable elements:
      //   * two bar handles (scStart, scEnd) set the playback window;
      //   * a circle (scPlayhead) is the current time, constrained to the
      //     window. Dragging a bound that would cross the playhead pushes the
      //     playhead; the invariant windowStart <= time <= windowEnd always
      //     holds.
      const scrubberEl = document.getElementById("timeScrubber")
      const scTrack = document.getElementById("scTrack")
      const scActive = document.getElementById("scActive")
      const scStartEl = document.getElementById("scStart")
      const scEndEl = document.getElementById("scEnd")
      const scPlayheadEl = document.getElementById("scPlayhead")
      const timeSliderLabel = document.getElementById("timeSliderLabel")
      const SC_PAD = 8 // px inset so edge handles aren't clipped
      let scrubberReady = false
      let scrubbing = false
      let resumeAfterScrub = false
      let scrubLoadTimer = null

      function fmtTime(epochSec) {
        const d = new Date(epochSec * 1000)
        // Format in the map center's timezone when known, else browser-local.
        // Use a concise, readable layout with the short tz abbreviation.
        try {
          const opts = {
            weekday: "short", month: "short", day: "numeric", year: "numeric",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            timeZoneName: "short",
          }
          if (mapTimeZone) opts.timeZone = mapTimeZone
          return new Intl.DateTimeFormat("en-US", opts).format(d)
        } catch (_) {
          // Bad/unsupported tz id -> fall back to the browser-local string
          // with the long tz name abbreviated to initials.
          return d.toString().replace(
            /\(([^)]+)\)/,
            (_m, name) => "(" + name.split(/\s+/).map(w => w[0] || "").join("") + ")"
          )
        }
      }

      function scWidth() {
        const w = scrubberEl.getBoundingClientRect().width || 200
        return Math.max(1, w - 2 * SC_PAD)
      }
      // epoch (within forecast range) -> x pixel, and inverse.
      function epochToX(epochSec) {
        if (forecastStart === null || forecastEnd === forecastStart) return SC_PAD
        const frac = (epochSec - forecastStart) / (forecastEnd - forecastStart)
        return SC_PAD + Math.max(0, Math.min(1, frac)) * scWidth()
      }
      function xToEpoch(x) {
        const frac = (x - SC_PAD) / scWidth()
        const raw = forecastStart + Math.max(0, Math.min(1, frac)) * (forecastEnd - forecastStart)
        return Math.round(raw)
      }

      // Redraw all three handles + the active segment from current state.
      function renderScrubber() {
        if (!scrubberReady) return
        const xs = epochToX(windowStart)
        const xe = epochToX(windowEnd)
        const xp = epochToX(time)
        scStartEl.setAttribute("x", String(xs - 3))
        scEndEl.setAttribute("x", String(xe - 3))
        scActive.setAttribute("x1", String(xs))
        scActive.setAttribute("x2", String(xe))
        scPlayheadEl.setAttribute("cx", String(xp))
        timeSliderLabel.textContent = fmtTime(time)
      }

      // Configure the scrubber once the forecast window is known. Named
      // configureScrubber (fetchGlobalRange calls it) and also aliased to the
      // old configureTimeSlider name used elsewhere.
      function configureScrubber() {
        if (forecastStart === null || forecastEnd === null) return
        scrubberReady = true
        renderScrubber()
      }
      function configureTimeSlider() { configureScrubber() }

      // --- URL persistence for the scrubber ---------------------------------
      // The window bounds and current time are stored as absolute epoch
      // seconds (from/to/t). On load they're clamped into the current forecast
      // range, so a shared/refreshed URL stays valid even if the forecast
      // window has since shifted.
      function persistScrubberState() {
        if (windowStart === null || windowEnd === null) return
        const u = new URL(window.location.href)
        u.searchParams.set("from", String(windowStart))
        u.searchParams.set("to", String(windowEnd))
        u.searchParams.set("t", String(time))
        history.replaceState(null, "", u.toString())
      }
      // Apply persisted from/to/t (if present) over the default full window.
      function applyUrlWindow() {
        if (forecastStart === null || forecastEnd === null) return
        const p = new URL(window.location.href).searchParams
        const clampRange = (v) => Math.max(forecastStart, Math.min(v, forecastEnd))
        const from = parseInt(p.get("from"), 10)
        const to = parseInt(p.get("to"), 10)
        const t = parseInt(p.get("t"), 10)
        const MIN_SPAN = Math.max(1, dt)
        if (Number.isFinite(from)) windowStart = clampRange(from)
        if (Number.isFinite(to)) windowEnd = clampRange(to)
        // Keep start < end with at least one dt of span.
        if (windowEnd <= windowStart) windowEnd = Math.min(forecastEnd, windowStart + MIN_SPAN)
        if (windowEnd <= windowStart) windowStart = Math.max(forecastStart, windowEnd - MIN_SPAN)
        if (Number.isFinite(t)) time = Math.max(windowStart, Math.min(t, windowEnd))
        else time = Math.max(windowStart, Math.min(time, windowEnd))
      }

      // Reflect the animation clock on the playhead (unless the user is
      // actively dragging something).
      function syncTimeSlider(t) {
        if (scrubbing) return
        renderScrubber()
      }

      // Pointer-driven dragging. `which` is "start" | "end" | "time".
      let dragWhich = null
      function pointerToEpoch(evt) {
        const rect = scrubberEl.getBoundingClientRect()
        return xToEpoch(evt.clientX - rect.left)
      }
      function beginDrag(which, evt) {
        if (!scrubberReady) return
        evt.stopPropagation(); evt.preventDefault()
        dragWhich = which
        if (!scrubbing) { // pause animation while interacting
          scrubbing = true
          resumeAfterScrub = !paused
          setPaused(true)
        }
        scrubberEl.setPointerCapture(evt.pointerId)
        onDrag(evt)
      }
      function onDrag(evt) {
        if (!dragWhich) return
        const MIN_SPAN = Math.max(1, dt) // keep at least one dt between bounds
        let e = pointerToEpoch(evt)
        if (dragWhich === "start") {
          // start can't exceed end (minus a span); clamp to forecast low.
          windowStart = Math.max(forecastStart, Math.min(e, windowEnd - MIN_SPAN))
          if (time < windowStart) time = windowStart // push playhead
        } else if (dragWhich === "end") {
          windowEnd = Math.min(forecastEnd, Math.max(e, windowStart + MIN_SPAN))
          if (time > windowEnd) time = windowEnd
        } else { // "time": constrained to [windowStart, windowEnd], snapped
                 // onto the frame lattice so the playhead lands on a real tick
                 // (and the frame the fill delivers matches what we display).
          time = snapToGrid(Math.max(windowStart, Math.min(e, windowEnd)))
        }
        renderScrubber()
        // Debounced frame load so dragging stays responsive.
        if (scrubLoadTimer) clearTimeout(scrubLoadTimer)
        scrubLoadTimer = window.setTimeout(() => { loadFrame(time) }, 60)
      }
      function endDrag(evt) {
        if (!dragWhich) return
        try { scrubberEl.releasePointerCapture(evt.pointerId) } catch (_) {}
        dragWhich = null
        // Load the final frame immediately, then resume if we were playing.
        if (scrubLoadTimer) { clearTimeout(scrubLoadTimer); scrubLoadTimer = null }
        loadFrame(time)
        persistScrubberState() // save window + time to the URL
        scrubbing = false
        if (resumeAfterScrub) setPaused(false)
        resumeAfterScrub = false
        // The window and/or playhead moved; recompute the cache fill for the
        // new window (ordered nearest the new playhead). Already-cached frames
        // are skipped.
        fillCache()
      }

      scStartEl.addEventListener("pointerdown", (e) => beginDrag("start", e))
      scEndEl.addEventListener("pointerdown", (e) => beginDrag("end", e))
      scPlayheadEl.addEventListener("pointerdown", (e) => beginDrag("time", e))
      // Clicking the track jumps the playhead there (within the window).
      scTrack.addEventListener("pointerdown", (e) => beginDrag("time", e))
      scActive.addEventListener("pointerdown", (e) => beginDrag("time", e))
      scrubberEl.addEventListener("pointermove", onDrag)
      scrubberEl.addEventListener("pointerup", endDrag)
      scrubberEl.addEventListener("pointercancel", endDrag)
      // Don't let scrubber interaction drag the legend.
      scrubberEl.addEventListener("pointerdown", (e) => e.stopPropagation())
      // Keep handles positioned correctly if the legend/window resizes.
      window.addEventListener("resize", renderScrubber)

      // Wire up the control buttons (stopPropagation so clicks don't drag the
      // legend).
      ;[["speedUp", () => stepSpeed(+1)],
        ["speedDown", () => stepSpeed(-1)],
        ["playPause", () => setPaused(!paused)],
        ["dtUp", () => stepDt(+1)],
        ["dtDown", () => stepDt(-1)],
        ["stepUp", () => stepContour(+1)],
        ["stepDown", () => stepContour(-1)]].forEach(([id, fn]) => {
        const btn = document.getElementById(id)
        btn.addEventListener("pointerdown", (e) => e.stopPropagation())
        btn.addEventListener("click", (e) => { e.stopPropagation(); fn() })
      })
      setPlaybackSpeed(playbackSpeed) // initialize the label
      setDt(dt) // initialize the dt label
      // Initialize the contour-interval label without disabling autoStep; the
      // real step is set by applyAutoStep() once the global range arrives.
      document.getElementById("stepLabel").textContent = formatStep(contourStep)

      // The contour-interval control only applies to isobands. In heatmap mode
      // intensity is continuous (no bands), so hide the whole row to avoid a
      // dead control.
      if (isHeatmap) {
        for (const id of ["contourRowLabel", "stepDown", "stepLabel", "stepUp"]) {
          const el = document.getElementById(id)
          if (el) el.style.display = "none"
        }
      }

      showSpinner("Loading data…")
      loading = true
      try {
        // Cache all the area's NOAA data first, streaming progress to the
        // spinner as each resource is fetched.
        await prefetchWithProgress()
        // Fix the color scale to the whole-lifecycle range before rendering.
        await fetchGlobalRange()
        time = clampToForecast(time)
        // The first frame now comes from the streaming cache-fill (loadFrame
        // waits for it), which can take a moment on a large cold area. Swap the
        // spinner message off the prefetch "Fetching data…" label so it doesn't
        // look stuck while the first frame computes.
        showSpinner("Rendering…")
        await loadFrame(time) // first frame (from the fill)
      } catch (err) {
        console.error("failed to load initial frame:", err)
      } finally {
        loading = false
        hideSpinner()
      }
      // loadFrame above already kicked off the cache fill on its miss; this is
      // a no-op if that fill already covers the window, or recomputes it if the
      // window/time changed in between. Not awaited — the first frame rendered;
      // the fill populates the rest in the background.
      fillCache()

      async function tick() {
        // If a tick is already running, try again shortly rather than
        // returning without rescheduling (which would silently kill the loop).
        if (tickRunning) { scheduleNext(); return }
        // Don't animate while a (re)load is in progress — otherwise the old
        // area's frames keep playing underneath the loading spinner.
        if (loading) { scheduleNext(); return }
        tickRunning = true
        time += dt
        // Loop the animation: once we step past the playback window's end,
        // jump back to the window start. Snap both the stepped time and the
        // wrap target onto the frame lattice so `time` never drifts off-grid
        // (adding dt to an off-grid value would otherwise accumulate phase
        // error and miss cached frames). snapToGrid clamps to [windowStart,
        // windowEnd] and returns the first in-window tick at the wrap.
        if (windowEnd !== null && time > windowEnd) {
          time = windowStart !== null ? windowStart : time
        }
        time = snapToGrid(time)
        try {
          await loadFrame(time)
        } catch (err) {
          console.error("frame error:", err)
        } finally {
          tickRunning = false
          scheduleNext()
        }
      }
      scheduleNext()
    })

    // Dismiss the basemap attribution popup.
    const items = document.getElementsByClassName("maplibregl-ctrl-attrib-button")
    for (const item of items) { item.click() }

    // Model selector: populate from the server's registered models and, on
    // change, navigate to that model's URL. Changing the model swaps the color
    // ramp, units, step defaults and derived kind — all computed server-side —
    // so a full navigation (reload) is the simplest correct approach. We keep
    // the current view (lat/lon/size/zoom/dt/speed) but drop `step` and `kind`
    // so the new model's auto-step and derived kind take effect.
    ;(function setupModelSelect() {
      const sel = document.getElementById("modelSelect")
      if (!sel) return
      for (const opt of modelOptions) {
        const o = document.createElement("option")
        o.value = opt.value
        o.textContent = opt.label
        if (opt.value === currentModel) o.selected = true
        sel.appendChild(o)
      }
      // Don't let interacting with the select start a legend drag.
      sel.addEventListener("pointerdown", (e) => e.stopPropagation())
      sel.addEventListener("change", (e) => {
        e.stopPropagation()
        const newModel = sel.value
        if (!newModel || newModel === currentModel) return
        const cur = new URL(window.location.href)
        const next = new URL(`/map/models/${encodeURIComponent(newModel)}/`, window.location.origin)
        // Carry over view/animation params; drop model-specific ones.
        for (const k of ["lat", "lon", "width", "height", "dt", "zoom", "speed"]) {
          const v = cur.searchParams.get(k)
          if (v !== null) next.searchParams.set(k, v)
        }
        window.location.assign(next.toString())
      })
    })()

    // Make the legend draggable.
    ;(function makeLegendDraggable() {
      const el = document.getElementById("legend")
      if (!el) return
      let dragging = false, offsetX = 0, offsetY = 0
      el.addEventListener("pointerdown", (e) => {
        dragging = true
        const rect = el.getBoundingClientRect()
        offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top
        el.style.top = rect.top + "px"; el.style.left = rect.left + "px"
        el.setPointerCapture(e.pointerId); e.preventDefault()
      })
      el.addEventListener("pointermove", (e) => {
        if (!dragging) return
        const maxX = window.innerWidth - el.offsetWidth, maxY = window.innerHeight - el.offsetHeight
        el.style.left = Math.max(0, Math.min(e.clientX - offsetX, maxX)) + "px"
        el.style.top = Math.max(0, Math.min(e.clientY - offsetY, maxY)) + "px"
      })
      el.addEventListener("pointerup", (e) => { dragging = false; el.releasePointerCapture(e.pointerId) })
    })()
  </script>
</html>
