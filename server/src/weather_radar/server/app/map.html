<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://unpkg.com/maplibre-gl@^4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- d3-contour builds filled isobands from a regular grid of values. -->
    <script src="https://unpkg.com/d3-contour@4"></script>
    <style>
      /* Shared styles for the legend's control buttons/values so the −/+
         columns line up across rows. */
      .ctlbtn {
        cursor: pointer; width: 22px; height: 22px; padding: 0;
        border: 1px solid #bbb; border-radius: 4px; background: #f5f5f5;
        font-size: 14px; line-height: 1;
      }
      .ctlval {
        text-align: center; font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body style="margin: 0px; padding: 0px;">
    <div id="weatherRadar" style="height: 100vh; width: 100vw; margin: 0px; padding: 0px;"/>

    <!-- Color legend (draggable), shown once the field renders. Fixed width
         so it never grows/shrinks as the (variable-length) timestamp updates. -->
    <div id="legend" style="
        position: fixed; top: 50px; left: 20px; z-index: 100;
        display: none; background: rgba(255,255,255,0.85); box-sizing: border-box;
        width: 360px;
        padding: 8px 10px; border-radius: 6px; font-family: sans-serif;
        font-size: 12px; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        cursor: move; user-select: none;">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
        <select id="modelSelect" title="Weather model"
          style="flex:1 1 auto; min-width:0; font-size:12px; font-weight:600;
          padding:2px 4px; border:1px solid #bbb; border-radius:4px; background:#fff; cursor:pointer;"></select>
        <span id="legendUnits" style="font-size:11px; color:#555; white-space:nowrap;"></span>
      </div>
      <div id="legendBar" style="height: 12px; width: 100%; border-radius: 2px;
        border: 1px solid rgba(0,0,0,0.2); box-sizing: border-box;"></div>
      <div style="display: flex; justify-content: space-between; margin-top: 2px;">
        <span id="legendMin"></span>
        <span id="legendMid"></span>
        <span id="legendMax"></span>
      </div>
      <!-- Playback controls. Rows share a grid so the −/+ buttons line up in
           consistent columns regardless of label/value width. -->
      <div style="margin-top:8px; padding-top:6px; border-top:1px solid rgba(0,0,0,0.12);">
        <!-- Play/Pause sits beside a custom range scrubber: two bar handles
             set the playback window [start, end] and a circle is the current
             time (constrained between the bars). All three are draggable. -->
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
          <button id="playPause" title="Pause / Play" style="cursor:pointer; flex:0 0 auto; height:24px;
            border:1px solid #bbb; border-radius:4px; background:#f5f5f5; font-size:12px; line-height:1; padding:0 8px;">⏸</button>
          <svg id="timeScrubber" width="100%" height="28" style="flex:1 1 auto; min-width:0; touch-action:none; overflow:visible;">
            <!-- Full track -->
            <line id="scTrack" x1="0" y1="14" x2="100%" y2="14" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
            <!-- Active window segment (between start & end bars) -->
            <line id="scActive" x1="0" y1="14" x2="0" y2="14" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
            <!-- Start / end bound handles -->
            <rect id="scStart" x="0" y="4" width="6" height="20" rx="2" fill="#1565c0" stroke="#fff" stroke-width="1" style="cursor:ew-resize"/>
            <rect id="scEnd" x="0" y="4" width="6" height="20" rx="2" fill="#1565c0" stroke="#fff" stroke-width="1" style="cursor:ew-resize"/>
            <!-- Current-time playhead -->
            <circle id="scPlayhead" cx="0" cy="14" r="7" fill="#fff" stroke="#1565c0" stroke-width="2.5" style="cursor:grab"/>
          </svg>
        </div>
        <div id="timeSliderLabel" style="font-size:13px; color:#333; text-align:center;
          margin-bottom:6px; font-variant-numeric:tabular-nums; font-weight:600;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">—</div>
        <div style="display:grid; grid-template-columns:1fr 22px 52px 22px; align-items:center;
            column-gap:6px; row-gap:6px;">
          <span style="font-size:11px; color:#555;">Speed</span>
          <button id="speedDown" title="Slower" class="ctlbtn">−</button>
          <span id="speedLabel" class="ctlval">1.0×</span>
          <button id="speedUp" title="Faster" class="ctlbtn">+</button>

          <span style="font-size:11px; color:#555;">Time</span>
          <button id="dtDown" title="Smaller time step" class="ctlbtn">−</button>
          <span id="dtLabel" class="ctlval">1h</span>
          <button id="dtUp" title="Larger time step" class="ctlbtn">+</button>

          <span id="contourRowLabel" style="font-size:11px; color:#555;">Contour</span>
          <button id="stepDown" title="Finer contours" class="ctlbtn">−</button>
          <span id="stepLabel" class="ctlval">1°</span>
          <button id="stepUp" title="Coarser contours" class="ctlbtn">+</button>
        </div>
      </div>
    </div>

    <!-- Cursor readout: follows the pointer with the interpolated value. -->
    <div id="cursorReadout" style="
        position: fixed; z-index: 101; display: none; pointer-events: none;
        background: rgba(0,0,0,0.75); color: #fff; font-family: sans-serif;
        font-size: 12px; padding: 4px 7px; border-radius: 4px;
        white-space: nowrap;"></div>

    <!-- Right-click context menu. -->
    <div id="contextMenu" style="
        position: fixed; z-index: 102; display: none;
        background: #fff; border: 1px solid rgba(0,0,0,0.2); border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-family: sans-serif;
        font-size: 13px; color: #222; overflow: hidden; min-width: 160px;">
      <div id="ctxCenterHere" style="padding: 8px 12px; cursor: pointer;">Center map here</div>
      <div id="ctxDropPin" style="padding: 8px 12px; cursor: pointer; border-top: 1px solid #eee;">Drop pin here</div>
      <div id="ctxSeeGraph" style="padding: 8px 12px; cursor: pointer; border-top: 1px solid #eee;">See graph</div>
      <div id="ctxCoords" style="padding: 6px 12px; font-size: 11px;
        color: #666; border-top: 1px solid #eee;"></div>
    </div>

    <!-- Container for dropped pin labels (positioned over the map in JS). -->
    <div id="pins"></div>

    <!-- Loading spinner, shown while data is being cached/fetched. -->
    <style>@keyframes wrspin { to { transform: rotate(360deg); } }</style>
    <div id="spinner" style="
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 103; display: none; pointer-events: none;
        text-align: center; font-family: sans-serif; color: #1565c0;">
      <div style="width: 44px; height: 44px; margin: 0 auto 6px;
          border: 5px solid rgba(21,101,192,0.25); border-top-color: #1565c0;
          border-radius: 50%; animation: wrspin 0.8s linear infinite;"></div>
      <div id="spinnerText" style="font-size: 12px; background: rgba(255,255,255,0.85);
          padding: 2px 8px; border-radius: 4px;">Loading data…</div>
    </div>
  </body>
  <script>
    // ---- Config (from the server) ------------------------------------------
    const model = {{weather_model}}
    const kind = "{{kind}}"
    let lat = {{starting_latitude}}
    let lon = {{starting_longitude}}
    let width = {{width}}
    let height = {{height}}
    let dt = {{dt}}
    const colorRamp = {{contour_color_ramp}}
    // Available models for the in-legend selector, and the current one.
    const modelOptions = {{model_options}}
    const currentModel = "{{current_model}}"
    // Contour interval: the value delta between adjacent contour lines
    // (e.g. 1.0, 0.5, 2.0 degrees). Configurable live in the legend.
    let contourStep = {{contour_step}}
    // When true, the step auto-scales to the data's global range (targeting a
    // readable number of bands). Any manual change in the legend turns this
    // off so the user's choice sticks. Set false when `step` is in the URL.
    let autoStep = {{auto_step}}

    // Fixed color-scale range across the whole forecast lifecycle, fetched
    // once before the first render so colors/legend stay stable over time.
    // Null until fetched (then buildContours falls back to the frame range).
    let globalMin = null, globalMax = null
    // Forecast time window (epoch seconds) for the current area, from the
    // range API — the FULL available range. Null until fetched.
    let forecastStart = null, forecastEnd = null
    // Active playback window (epoch seconds): the user-adjustable [start, end]
    // the scrubber spans and the animation loops over. Defaults to the full
    // forecast window; always kept within [forecastStart, forecastEnd].
    let windowStart = null, windowEnd = null
    // IANA timezone of the map center (from NOAA /points); null => browser-local.
    let mapTimeZone = null
    let lastFeatures = []  // most recent frame's features (for instant re-render on contour-step change)

    // Grid resolution and interpolation smoothing for the contour field.
    const GRID = 64
    // IDW smoothing radius (squared, in deg^2) added to each weight's
    // denominator. NOAA gridpoints are ~2.5km (~0.023 deg) apart; a radius
    // around half the spacing blends neighbors smoothly and avoids the
    // "bull's-eye" rings that appear when points dominate tight circles.
    const IDW_EPS = 0.015 * 0.015
    const COLOR_BUFFER = 0.1

    const initialZoom = parseFloat(new URL(window.location.href).searchParams.get("zoom")) || 9

    const map = new maplibregl.Map({
      container: "weatherRadar",
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [lon, lat],
      zoom: initialZoom,
    })

    // ---- Spinner ------------------------------------------------------------
    const spinnerEl = document.getElementById("spinner")
    const spinnerTextEl = document.getElementById("spinnerText")
    function showSpinner(msg) {
      spinnerTextEl.textContent = msg || "Loading data…"
      spinnerEl.style.display = "block"
    }
    function hideSpinner() { spinnerEl.style.display = "none" }
    // Show a per-phase completed/total fraction, e.g. "Resolving grid… 12 / 48"
    // then "Fetching data… 30 / 46". Points and gridpoints are counted
    // separately.
    const PHASE_LABELS = { points: "Resolving grid", gridpoints: "Fetching data" }
    function setSpinnerProgress(phase, done, total) {
      const label = PHASE_LABELS[phase] || "Loading"
      spinnerTextEl.textContent = total
        ? `${label}… ${done} / ${total}`
        : `${label}…`
    }

    // ---- Color ramp ---------------------------------------------------------
    const rampStops = (() => {
      const stops = []
      for (let i = 0; i < colorRamp.length; i += 2) {
        const m = String(colorRamp[i + 1]).match(/rgba?\(([^)]+)\)/)
        const p = m[1].split(',').map(s => parseFloat(s.trim()))
        stops.push({ pos: colorRamp[i], r: p[0], g: p[1], b: p[2] })
      }
      return stops
    })()
    function rampColorAt(t) {
      t = Math.max(0, Math.min(1, t))
      let a = rampStops[0], b = rampStops[rampStops.length - 1]
      for (let i = 0; i < rampStops.length - 1; i++) {
        if (t >= rampStops[i].pos && t <= rampStops[i + 1].pos) { a = rampStops[i]; b = rampStops[i + 1]; break }
      }
      const span = (b.pos - a.pos) || 1
      const f = (t - a.pos) / span
      return `rgb(${Math.round(a.r + (b.r - a.r) * f)}, ${Math.round(a.g + (b.g - a.g) * f)}, ${Math.round(a.b + (b.b - a.b) * f)})`
    }

    // ---- Legend -------------------------------------------------------------
    let legendInitialized = false
    function legendGradientCss() {
      const stops = []
      for (let i = 0; i < colorRamp.length; i += 2) {
        stops.push(`${colorRamp[i + 1]} ${Math.round(colorRamp[i] * 100)}%`)
      }
      return `linear-gradient(to right, ${stops.join(", ")})`
    }
    function updateLegend(vMin, vMax, units) {
      if (!legendInitialized) {
        document.getElementById("legendBar").style.background = legendGradientCss()
        legendInitialized = true
      }
      document.getElementById("legendUnits").textContent = units ? `(${units})` : ""
      document.getElementById("legendMin").textContent = vMin.toFixed(1)
      document.getElementById("legendMid").textContent = ((vMin + vMax) / 2).toFixed(1)
      document.getElementById("legendMax").textContent = vMax.toFixed(1)
      document.getElementById("legend").style.display = "block"
    }

    // ---- Contour construction ----------------------------------------------

    // Build filled contour polygons (GeoJSON) from a scatter of features.
    // Returns { fc, vMin, vMax, units } or null if there isn't enough data.
    function buildContours(features) {
      const pts = features.map(f => ({
        lon: f.geometry.coordinates[0],
        lat: f.geometry.coordinates[1],
        v: f.properties[model]
      })).filter(p => Number.isFinite(p.v))
      if (pts.length < 3) return null

      let minLon = Math.min(...pts.map(p => p.lon))
      let maxLon = Math.max(...pts.map(p => p.lon))
      let minLat = Math.min(...pts.map(p => p.lat))
      let maxLat = Math.max(...pts.map(p => p.lat))
      const padLon = (maxLon - minLon) * 0.05 || 0.01
      const padLat = (maxLat - minLat) * 0.05 || 0.01
      minLon -= padLon; maxLon += padLon; minLat -= padLat; maxLat += padLat

      // IDW resample onto a GRID x GRID lattice (row 0 = minLat).
      const values = new Array(GRID * GRID)
      let vMin = Infinity, vMax = -Infinity
      for (let gy = 0; gy < GRID; gy++) {
        const plat = minLat + (gy / (GRID - 1)) * (maxLat - minLat)
        for (let gx = 0; gx < GRID; gx++) {
          const plon = minLon + (gx / (GRID - 1)) * (maxLon - minLon)
          let num = 0, den = 0, exact = null
          for (const p of pts) {
            const dLon = plon - p.lon, dLat = plat - p.lat
            const d2 = dLon * dLon + dLat * dLat
            if (d2 < 1e-12) { exact = p.v; break }
            const w = 1 / (d2 + IDW_EPS) // IDW power 2
            num += w * p.v; den += w
          }
          const val = exact !== null ? exact : num / den
          values[gy * GRID + gx] = val
          if (val < vMin) vMin = val
          if (val > vMax) vMax = val
        }
      }
      // If the field is completely flat (e.g. an all-zero accumulation like
      // snowfall with no snow forecast), there are no contours to draw. Emit
      // an empty collection rather than letting d3-contour produce spurious
      // full-extent polygons for thresholds at/below the constant value.
      const FLAT_EPS = 1e-9
      if (!(vMax - vMin > FLAT_EPS)) {
        return { fc: { type: "FeatureCollection", features: [] }, vMin, vMax, units: features[0].properties.uom || "" }
      }

      // Color scale: use the FIXED global range (whole forecast lifecycle)
      // when available, so a given temperature is the same color in every
      // frame and the legend never shifts. Fall back to the frame's own range.
      const cMin = (globalMin !== null) ? globalMin : vMin
      const cMax = (globalMax !== null && globalMax > globalMin) ? globalMax : vMax
      const cSpan = (cMax - cMin) || 1

      // Thresholds are anchored to FIXED absolute values spaced `contourStep`
      // apart (e.g. every 1.0 degree), so a given isoline is always at the
      // same absolute value every frame. Only thresholds that lie strictly
      // INSIDE the field's (vMin, vMax) range are kept: a threshold at or
      // beyond the extremes isn't actually crossed by the field, and d3
      // would otherwise emit a spurious full-extent (or empty) polygon.
      const step = contourStep
      const tLo = Math.ceil(vMin / step) * step
      const tHi = Math.floor(vMax / step) * step
      const thresholds = []
      for (let tv = tLo; tv <= tHi + 1e-9; tv += step) {
        if (tv > vMin + 1e-9 && tv < vMax - 1e-9) thresholds.push(tv)
      }
      if (!thresholds.length) {
        return { fc: { type: "FeatureCollection", features: [] }, vMin, vMax, units: features[0].properties.uom || "" }
      }

      const polys = d3.contours().size([GRID, GRID]).thresholds(thresholds)(values)

      const sx = (maxLon - minLon) / (GRID - 1)
      const sy = (maxLat - minLat) / (GRID - 1)
      const toLngLat = ([gx, gy]) => [minLon + gx * sx, minLat + gy * sy]

      const outFeatures = polys.map(poly => {
        const raw = (poly.value - cMin) / cSpan
        const t = COLOR_BUFFER + Math.max(0, Math.min(1, raw)) * (1 - 2 * COLOR_BUFFER)
        return {
          type: "Feature",
          properties: { fillColor: rampColorAt(t) },
          geometry: {
            type: "MultiPolygon",
            coordinates: poly.coordinates.map(pg => pg.map(ring => ring.map(toLngLat)))
          }
        }
      })

      const units = features[0].properties.uom || ""
      // Report the color-scale range (global when fixed) so the legend matches
      // the colors and stays stable across frames.
      return { fc: { type: "FeatureCollection", features: outFeatures }, vMin: cMin, vMax: cMax, units }
    }

    // ---- Cursor readout -----------------------------------------------------
    let latestPoints = [], latestUnits = ""
    function sampleAt(plon, plat) {
      if (!latestPoints.length) return null
      let num = 0, den = 0
      for (const p of latestPoints) {
        const dLon = plon - p.lon, dLat = plat - p.lat
        const d2 = dLon * dLon + dLat * dLat
        if (d2 < 1e-12) return p.v
        const w = 1 / (d2 + IDW_EPS)
        num += w * p.v; den += w
      }
      return num / den
    }

    map.on("load", async () => {
      // Contour sources + layers. A faint fill keeps the basemap visible while
      // strong, opaque borders make the contour structure legible.
      map.addSource("contours", { type: 'geojson', data: { type: "FeatureCollection", features: [] } })
      map.addLayer({
        id: 'contours', type: 'fill', source: 'contours',
        paint: { 'fill-color': ['get', 'fillColor'], 'fill-opacity': 0.05, 'fill-antialias': true }
      })
      map.addLayer({
        id: 'contour-lines', type: 'line', source: 'contours',
        layout: { 'line-join': 'round' },
        paint: { 'line-color': ['get', 'fillColor'], 'line-width': 1.6, 'line-opacity': 0.9 }
      })

      const mapContainer = document.getElementById("weatherRadar")
      const readoutEl = document.getElementById("cursorReadout")
      let cursorPx = null

      function refreshReadout() {
        if (!cursorPx) { readoutEl.style.display = "none"; return }
        const rect = mapContainer.getBoundingClientRect()
        const ll = map.unproject([cursorPx.x - rect.left, cursorPx.y - rect.top])
        const v = sampleAt(ll.lng, ll.lat)
        const valueText = v === null ? "—" : `${v.toFixed(1)}${latestUnits ? " " + latestUnits : ""}`
        readoutEl.innerHTML = `${model}: ${valueText}<br>${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`
        readoutEl.style.left = (cursorPx.x + 12) + "px"
        readoutEl.style.top = (cursorPx.y + 12) + "px"
        readoutEl.style.display = "block"
      }
      mapContainer.addEventListener("mousemove", (e) => { cursorPx = { x: e.clientX, y: e.clientY }; refreshReadout() })
      mapContainer.addEventListener("mouseleave", () => { cursorPx = null; readoutEl.style.display = "none" })
      map.on("move", () => { refreshReadout(); refreshPins() })

      // ---- Dropped pins -----------------------------------------------------
      // Persistent labels at fixed lat/lon showing the interpolated value,
      // updated each frame and repositioned on map move. Persisted in the URL
      // (`pins=lat,lon;lat,lon;...`) so a refresh restores them.
      const pinsContainer = document.getElementById("pins")
      let pins = [] // [{ lat, lon, el }]

      function serializePins() {
        const u = new URL(window.location.href)
        if (pins.length) {
          u.searchParams.set("pins", pins.map(p => `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`).join(";"))
        } else {
          u.searchParams.delete("pins")
        }
        history.replaceState(null, "", u.toString())
      }

      function addPin(plat, plon, persist = true) {
        // Marker: a pin icon anchored exactly at the point (tip at the spot).
        const marker = document.createElement("div")
        marker.textContent = "📍"
        marker.style.cssText = "position:fixed; z-index:101; transform:translate(-50%,-100%);" +
          "font-size:20px; line-height:1; cursor:pointer; user-select:none;" +
          "filter:drop-shadow(0 1px 1px rgba(0,0,0,0.5));"
        // Info box: offset to the upper-right of the marker.
        const info = document.createElement("div")
        info.style.cssText = "position:fixed; z-index:101; transform:translate(0,-100%);" +
          "background:rgba(30,30,30,0.85); color:#fff; font-family:sans-serif; font-size:12px;" +
          "padding:3px 7px; border-radius:4px; white-space:nowrap; cursor:pointer;" +
          "box-shadow:0 1px 4px rgba(0,0,0,0.4);"

        const pin = { lat: plat, lon: plon, marker, info }
        const remove = (ev) => {
          ev.stopPropagation()
          const i = pins.indexOf(pin)
          if (i >= 0) { marker.remove(); info.remove(); pins.splice(i, 1); serializePins() }
        }
        marker.title = "Click to remove pin"
        info.title = "Click to remove pin"
        marker.addEventListener("click", remove)
        info.addEventListener("click", remove)

        pinsContainer.appendChild(marker)
        pinsContainer.appendChild(info)
        pins.push(pin)
        if (persist) serializePins()
        refreshPins()
      }

      // Reposition + re-read all pins (called on map move and each frame).
      // The marker sits on the point; the info box is offset to the
      // upper-right so it doesn't cover the location.
      const INFO_DX = 14, INFO_DY = -14
      function refreshPins() {
        const rect = mapContainer.getBoundingClientRect()
        for (const p of pins) {
          const pt = map.project([p.lon, p.lat])
          const x = rect.left + pt.x, y = rect.top + pt.y
          p.marker.style.left = x + "px"
          p.marker.style.top = y + "px"

          const v = sampleAt(p.lon, p.lat)
          const valueText = v === null ? "—" : `${v.toFixed(1)}${latestUnits ? " " + latestUnits : ""}`
          p.info.innerHTML = `${model}: ${valueText}<br>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`
          p.info.style.left = (x + INFO_DX) + "px"
          p.info.style.top = (y + INFO_DY) + "px"
        }
      }

      // Restore pins from the URL on load.
      ;(() => {
        const raw = new URL(window.location.href).searchParams.get("pins")
        if (!raw) return
        for (const part of raw.split(";")) {
          const [la, lo] = part.split(",").map(Number)
          if (Number.isFinite(la) && Number.isFinite(lo)) addPin(la, lo, false)
        }
      })()

      // Remove every pin (DOM + state) and clear them from the URL.
      function clearPins() {
        for (const p of pins) { p.marker.remove(); p.info.remove() }
        pins = []
        serializePins()
      }

      // Right-click context menu: "Center map here".
      const menuEl = document.getElementById("contextMenu")
      const ctxCoordsEl = document.getElementById("ctxCoords")
      let menuLngLat = null
      function hideMenu() { menuEl.style.display = "none" }
      map.on("contextmenu", (e) => {
        menuLngLat = e.lngLat
        ctxCoordsEl.textContent = `${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`
        menuEl.style.left = e.originalEvent.clientX + "px"
        menuEl.style.top = e.originalEvent.clientY + "px"
        menuEl.style.display = "block"
      })
      // "Drop pin here": leave a persistent value label at the clicked point.
      document.getElementById("ctxDropPin").addEventListener("click", () => {
        if (!menuLngLat) return
        addPin(menuLngLat.lat, menuLngLat.lng)
        hideMenu()
      })
      // "See graph": open the forecast graph for this location in a new tab.
      // The graph's `models` param maps model-type -> [attribute], e.g.
      // {"observation": ["temperature"]}.
      document.getElementById("ctxSeeGraph").addEventListener("click", () => {
        if (!menuLngLat) return
        const models = JSON.stringify({ [kind]: [model] })
        const u = new URL("/graph/", window.location.origin)
        u.searchParams.set("models", models)
        u.searchParams.set("lat", menuLngLat.lat.toFixed(6))
        u.searchParams.set("lon", menuLngLat.lng.toFixed(6))
        hideMenu()
        window.open(u.toString(), "_blank")
      })
      document.getElementById("ctxCenterHere").addEventListener("click", async () => {
        if (!menuLngLat) return
        lat = menuLngLat.lat
        lon = menuLngLat.lng
        hideMenu()

        // Centering moves to a new area, so existing pins no longer apply.
        clearPins()

        // Size the fetched area to the current viewport so the contour field
        // covers the whole window. The map's lat/lon span (in degrees) is
        // converted to km mirroring the server geometry: width drives the
        // lon-span, height the lat-span. (Pan doesn't change the span, only
        // the center, so reading bounds now is correct for the new view.)
        const b = map.getBounds()
        width = Math.abs(b.getEast() - b.getWest()) * 110.574
        height = Math.abs(b.getNorth() - b.getSouth()) * (111.320 * Math.cos(lat * Math.PI / 180))

        // Pan to the new center (keep current zoom) and sync the URL in place
        // — no page reload.
        map.easeTo({ center: [lon, lat], duration: 500 })
        const u = new URL(window.location.href)
        u.searchParams.set("lat", lat.toFixed(6))
        u.searchParams.set("lon", lon.toFixed(6))
        u.searchParams.set("width", width.toFixed(2))
        u.searchParams.set("height", height.toFixed(2))
        u.searchParams.set("zoom", map.getZoom().toFixed(2))
        // Re-centering starts a fresh playback window for the new area; drop
        // any persisted scrubber state so it doesn't carry over.
        u.searchParams.delete("from")
        u.searchParams.delete("to")
        u.searchParams.delete("t")
        history.replaceState(null, "", u.toString())

        // Reset the animation clock to "now" and reload for the new area:
        // cache its data, recompute the fixed color range, then render.
        time = Math.floor(Date.now() / 1000)
        globalMin = null; globalMax = null
        forecastStart = null; forecastEnd = null
        windowStart = null; windowEnd = null
        mapTimeZone = null
        scrubberReady = false
        // Invalidate any in-flight frame load from the previous area so a
        // stale result can't render over the new one. The `loading` flag gates
        // the animation tick (it keeps looping but won't render) until the new
        // area is ready, so we don't need to pause/resume playback.
        loadGeneration += 1
        loading = true
        // New area: drop the previous area's cached API responses so the
        // client cache doesn't grow unbounded or serve stale frames.
        apiClient.clear()
        // Clear the old area's contours immediately so stale lines aren't left
        // on screen while the new area loads.
        lastFeatures = []
        const src = map.getSource("contours")
        if (src) src.setData({ type: "FeatureCollection", features: [] })
        showSpinner("Loading data…")
        try {
          await prefetchWithProgress()
          await fetchGlobalRange()
          time = clampToForecast(time)
          await loadFrame(time)
        } catch (err) {
          console.error("re-center load failed:", err)
        } finally {
          loading = false
          hideSpinner()
          // Resume the animation for the new area (unless the user has it
          // paused). Kick the loop explicitly rather than assuming one is
          // still scheduled — a gated tick may have already drained.
          if (!paused) { if (tickTimer) { clearTimeout(tickTimer); tickTimer = null } scheduleNext() }
        }
      })
      map.on("click", hideMenu)
      map.on("movestart", hideMenu)
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") hideMenu() })

      // ---- Rendering --------------------------------------------------------
      // Render one frame's features as a contour field.
      function renderFeatures(features) {
        lastFeatures = features
        latestPoints = features.map(f => ({
          lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], v: f.properties[model]
        })).filter(p => Number.isFinite(p.v))
        latestUnits = features.length ? (features[0].properties.uom || "") : ""

        // Now that units are known, make sure the contour-interval label shows
        // them (e.g. "2 mm" instead of a placeholder degree symbol).
        const stepLbl = document.getElementById("stepLabel")
        if (stepLbl) stepLbl.textContent = formatStep(contourStep)

        const info = buildContours(features)
        if (info) {
          map.getSource("contours").setData(info.fc)
          updateLegend(info.vMin, info.vMax, info.units)
        }
        // Keep the cursor readout and dropped pins in sync with the new
        // frame's data.
        refreshReadout()
        refreshPins()
      }

      // --- Caching API client ------------------------------------------------
      // A thin wrapper over fetch() that caches parsed JSON responses. Callers
      // request a URL (with an optional explicit cache key); if we already have
      // the data cached, it's returned immediately with NO network call. It
      // also deduplicates in-flight requests — two callers asking for the same
      // key while a fetch is pending share that one fetch (so the animation
      // loop and a timeline scrub won't double-fetch the same frame).
      //
      // The cache is scoped to the current area: apiClient.clear() is called on
      // re-center so stale frames from a previous location are dropped.
      const apiClient = (() => {
        const cache = new Map()      // key -> parsed JSON (resolved value)
        const inflight = new Map()   // key -> Promise<parsed JSON>

        async function getJson(url, cacheKey) {
          const key = cacheKey || url
          if (cache.has(key)) return cache.get(key)        // hit: no network
          if (inflight.has(key)) return inflight.get(key)  // coalesce duplicates
          const p = (async () => {
            const resp = await fetch(url)
            if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`)
            const data = await resp.json()
            cache.set(key, data)
            return data
          })()
          inflight.set(key, p)
          try {
            return await p
          } finally {
            inflight.delete(key)
          }
        }

        return {
          getJson,
          has: (key) => cache.has(key),
          clear: () => { cache.clear(); inflight.clear() },
          size: () => cache.size,
        }
      })()

      // Fetch the full ensemble for a given time and render it. Returns true
      // on success. Goes through the caching client, so a repeated time
      // (looping / scrubbing back over) renders from memory with no network.
      async function loadFrame(time) {
        // Capture the current load generation; a re-center bumps it, so a
        // frame request that was in flight across a re-center won't render its
        // (now stale) result over the new area.
        const gen = loadGeneration
        const url =
          `/api/models/${model}/type/ensemble?lat=${lat}&lon=${lon}&width=${width}&height=${height}&time=${time}&dt=${dt}&kind=${kind}`
        // Cache key omits dt: the server's per-frame prediction depends only on
        // the concrete `time`, so a timestamp fetched under one dt is reusable
        // under another (scrubbing, looping, changing the step all hit cache).
        const cacheKey = `ensemble|${model}|${kind}|${lat}|${lon}|${width}|${height}|${time}`
        let data
        try {
          data = await apiClient.getJson(url, cacheKey)
        } catch (err) {
          console.error("ensemble request failed:", err)
          return false
        }
        if (gen !== loadGeneration) return false  // superseded by a re-center
        const features = (data && data.features) || []
        renderFeatures(features)
        syncTimeSlider(time)
        return true
      }

      // Stream prefetch progress from NOAA and drive the spinner with a live
      // completed/total fraction per phase (resolving grid, then fetching
      // data). Resolves once the area is fully cached. Falls back to the plain
      // (blocking, no-progress) prefetch if streaming isn't available.
      async function prefetchWithProgress() {
        const url = `/api/models/prefetch/stream?lat=${lat}&lon=${lon}&width=${width}&height=${height}`
        let resp
        try {
          resp = await fetch(url)
        } catch (err) {
          resp = null
        }
        if (!resp || !resp.ok || !resp.body) {
          // Fallback: blocking prefetch with a generic message.
          showSpinner("Loading data…")
          await fetch(`/api/models/prefetch?lat=${lat}&lon=${lon}&width=${width}&height=${height}`)
          return
        }
        const reader = resp.body.getReader()
        const decoder = new TextDecoder()
        let buffer = ""
        const handle = (line) => {
          if (!line) return
          try {
            const p = JSON.parse(line)
            setSpinnerProgress(p.phase, p.done, p.total)
          } catch (_) {}
        }
        for (;;) {
          const { value, done } = await reader.read()
          if (done) break
          buffer += decoder.decode(value, { stream: true })
          let nl
          while ((nl = buffer.indexOf("\n")) >= 0) {
            handle(buffer.slice(0, nl).trim())
            buffer = buffer.slice(nl + 1)
          }
        }
        handle(buffer.trim())
      }

      // Fetch the fixed global value range for the current area (whole
      // forecast lifecycle) so colors/legend stay stable across frames.
      // Safe to call after /prefetch.
      async function fetchGlobalRange() {
        try {
          const resp = await fetch(
            `/api/models/${model}/type/range?lat=${lat}&lon=${lon}&width=${width}&height=${height}&kind=${kind}`
          )
          const r = await resp.json()
          if (r && Number.isFinite(r.min) && Number.isFinite(r.max) && r.max > r.min) {
            globalMin = r.min; globalMax = r.max
            console.log("[field] global range:", globalMin.toFixed(1), "-", globalMax.toFixed(1), r.uom)
            // Auto-scale the contour interval to the range (unless the user
            // has pinned a step manually / via URL).
            if (autoStep) applyAutoStep()
          }
          // The map center's IANA timezone, so times display in the location's
          // local zone rather than the browser's. Falls back to browser-local.
          mapTimeZone = (r && r.timeZone) || null
          // Capture the forecast window; default the playback window to it,
          // then apply any persisted window/time from the URL (clamped into
          // the available forecast range).
          const s = r && r.start ? Math.floor(Date.parse(r.start) / 1000) : NaN
          const e = r && r.end ? Math.floor(Date.parse(r.end) / 1000) : NaN
          if (Number.isFinite(s) && Number.isFinite(e) && e > s) {
            forecastStart = s; forecastEnd = e
            windowStart = s; windowEnd = e
            applyUrlWindow()
            console.log("[field] forecast window:", new Date(s * 1000).toISOString(), "->", new Date(e * 1000).toISOString())
            configureScrubber()
          }
        } catch (err) {
          console.warn("global range fetch failed; using per-frame range:", err)
        }
      }

      // Clamp a time (epoch seconds) into the active playback window if known,
      // so the first frame after a (re)load always falls on valid data.
      function clampToForecast(t) {
        if (windowStart !== null && t < windowStart) return windowStart
        if (windowEnd !== null && t > windowEnd) return windowStart !== null ? windowStart : t
        return t
      }

      // ---- Animation over time ---------------------------------------------
      // Each frame advances model time by `dt`. The next frame is scheduled
      // only after the current one finishes, so slow frames don't stack up.
      const BASE_FRAME_INTERVAL_MS = 1000
      let playbackSpeed = {{playback_speed}}
      let paused = false
      let tickTimer = null
      let tickRunning = false
      let time = Math.floor(Date.now() / 1000)
      // Bumped whenever we switch areas (re-center), so in-flight frame loads
      // from the previous area can detect they've been superseded and skip
      // rendering stale contours over the new location.
      let loadGeneration = 0
      // True while a (re)load is in progress. The animation tick refuses to
      // run while this is set, so the old area's frames can't keep animating
      // underneath the loading spinner.
      let loading = false

      function frameIntervalMs() {
        // Floor of 20ms (=50x at the 1s base) so the top speeds aren't clamped
        // to the same interval. Actual throughput is still bounded by per-frame
        // render time; the loop schedules the next frame only after the current
        // one finishes, so frames can't stack up regardless.
        return Math.max(20, BASE_FRAME_INTERVAL_MS / playbackSpeed)
      }
      // Discrete speed ladder the +/- buttons step through. Includes the
      // requested 20x and 50x at the top end.
      const SPEED_STEPS = [0.25, 0.5, 1, 2, 5, 10, 20, 50]
      function stepSpeed(dir) {
        // Snap current speed to the nearest ladder index, then move one step.
        let i = 0, best = Infinity
        for (let k = 0; k < SPEED_STEPS.length; k++) {
          const d = Math.abs(SPEED_STEPS[k] - playbackSpeed)
          if (d < best) { best = d; i = k }
        }
        i = Math.max(0, Math.min(SPEED_STEPS.length - 1, i + dir))
        setPlaybackSpeed(SPEED_STEPS[i])
      }
      function setPlaybackSpeed(mult) {
        playbackSpeed = Math.max(0.1, Math.min(mult, 50))
        const lbl = document.getElementById("speedLabel")
        if (lbl) lbl.textContent = playbackSpeed.toFixed(1) + "×"
        const u = new URL(window.location.href)
        u.searchParams.set("speed", playbackSpeed.toFixed(2))
        history.replaceState(null, "", u.toString())
      }
      function updatePlayPauseButton() {
        const btn = document.getElementById("playPause")
        if (btn) { btn.textContent = paused ? "▶" : "⏸"; btn.title = paused ? "Play" : "Pause" }
      }
      function setPaused(p) {
        if (p === paused) return
        paused = p
        updatePlayPauseButton()
        if (!paused) { // resume: cancel stray timer, kick the loop
          if (tickTimer) { clearTimeout(tickTimer); tickTimer = null }
          scheduleNext()
        } else if (!scrubbing) {
          // Pausing to a resting state: capture the current time in the URL.
          // (During a scrub, endDrag handles persistence instead.)
          persistScrubberState()
        }
      }
      function scheduleNext() {
        if (!paused) tickTimer = window.setTimeout(tick, frameIntervalMs())
      }

      // Time-step (dt) control. Steps through a preset list of nice durations.
      const DT_PRESETS = [300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400] // seconds
      function formatDt(secs) {
        if (secs < 3600) return (secs / 60) + "m"
        const h = secs / 3600
        return (Number.isInteger(h) ? h : h.toFixed(1)) + "h"
      }
      function setDt(secs) {
        dt = Math.max(DT_PRESETS[0], Math.min(secs, DT_PRESETS[DT_PRESETS.length - 1]))
        const lbl = document.getElementById("dtLabel")
        if (lbl) lbl.textContent = formatDt(dt)
        const u = new URL(window.location.href)
        u.searchParams.set("dt", String(dt))
        history.replaceState(null, "", u.toString())
      }
      function stepDt(dir) {
        // Move to the neighboring preset (dir = +1 bigger, -1 smaller).
        let i = DT_PRESETS.findIndex(v => v >= dt)
        if (i < 0) i = DT_PRESETS.length - 1
        // If current dt isn't exactly a preset, snap toward the requested dir.
        if (DT_PRESETS[i] !== dt && dir < 0) i -= 1
        const next = Math.max(0, Math.min(i + dir, DT_PRESETS.length - 1))
        setDt(DT_PRESETS[next])
      }

      // Contour interval control. Steps through preset deltas, labeled in the
      // model's own units (° for temperature, mm for precip/snow, etc.).
      const STEP_PRESETS = [0.25, 0.5, 1, 2, 5, 10, 20]
      // Derive the step-label unit suffix from the current data's units.
      // Temperature-like units render as a degree symbol; everything else gets
      // a space-separated unit (e.g. "mm"). Falls back to "°" before the first
      // frame's units are known.
      function stepUnitSuffix() {
        const u = (latestUnits || "").toLowerCase()
        if (!u) return "\u00b0"
        if (u === "degf" || u === "degc" || u === "f" || u === "c") return "\u00b0"
        return " " + latestUnits
      }
      function formatStep(s) {
        // Trim to at most 2 decimals, dropping trailing zeros.
        const n = Math.round(s * 100) / 100
        return (Number.isInteger(n) ? n : n) + stepUnitSuffix()
      }

      // Snap a raw interval to a "nice" number: {1, 2, 2.5, 5, 10} x 10^n.
      // Keeps contour intervals human-friendly regardless of the data range.
      function niceStep(raw) {
        if (!(raw > 0)) return 1
        const mag = Math.pow(10, Math.floor(Math.log10(raw)))
        const norm = raw / mag // in [1, 10)
        let nice
        if (norm < 1.5) nice = 1
        else if (norm < 3) nice = 2
        else if (norm < 4) nice = 2.5
        else if (norm < 7.5) nice = 5
        else nice = 10
        return nice * mag
      }

      // Auto-scale the contour interval to the global value range, targeting a
      // readable number of bands. Does not touch the URL or the autoStep flag
      // (it IS the auto behavior). Re-renders the current frame.
      const TARGET_BANDS = 10
      function applyAutoStep() {
        if (globalMin === null || globalMax === null) return
        const range = globalMax - globalMin
        if (!(range > 0)) return
        contourStep = niceStep(range / TARGET_BANDS)
        const lbl = document.getElementById("stepLabel")
        if (lbl) lbl.textContent = formatStep(contourStep)
        if (lastFeatures.length) renderFeatures(lastFeatures)
      }

      // Set the interval from an explicit user action: pins the value, records
      // it in the URL, and disables auto-scaling so the choice sticks.
      function setContourStep(s) {
        contourStep = Math.max(0.05, Math.min(s, 100))
        autoStep = false
        const lbl = document.getElementById("stepLabel")
        if (lbl) lbl.textContent = formatStep(contourStep)
        const u = new URL(window.location.href)
        u.searchParams.set("step", String(contourStep))
        history.replaceState(null, "", u.toString())
      }
      function stepContour(dir) {
        // Cycle through the presets relative to the current step.
        let i = STEP_PRESETS.findIndex(v => v >= contourStep - 1e-9)
        if (i < 0) i = STEP_PRESETS.length - 1
        if (STEP_PRESETS[i] > contourStep + 1e-9 && dir < 0) i -= 1
        const next = Math.max(0, Math.min(i + dir, STEP_PRESETS.length - 1))
        setContourStep(STEP_PRESETS[next]) // manual -> disables autoStep
        // Re-render the current frame immediately with the new interval.
        if (lastFeatures.length) renderFeatures(lastFeatures)
      }

      // ---- Custom time scrubber --------------------------------------------
      // An SVG with three draggable elements:
      //   * two bar handles (scStart, scEnd) set the playback window;
      //   * a circle (scPlayhead) is the current time, constrained to the
      //     window. Dragging a bound that would cross the playhead pushes the
      //     playhead; the invariant windowStart <= time <= windowEnd always
      //     holds.
      const scrubberEl = document.getElementById("timeScrubber")
      const scTrack = document.getElementById("scTrack")
      const scActive = document.getElementById("scActive")
      const scStartEl = document.getElementById("scStart")
      const scEndEl = document.getElementById("scEnd")
      const scPlayheadEl = document.getElementById("scPlayhead")
      const timeSliderLabel = document.getElementById("timeSliderLabel")
      const SC_PAD = 8 // px inset so edge handles aren't clipped
      let scrubberReady = false
      let scrubbing = false
      let resumeAfterScrub = false
      let scrubLoadTimer = null

      function fmtTime(epochSec) {
        const d = new Date(epochSec * 1000)
        // Format in the map center's timezone when known, else browser-local.
        // Use a concise, readable layout with the short tz abbreviation.
        try {
          const opts = {
            weekday: "short", month: "short", day: "numeric", year: "numeric",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            timeZoneName: "short",
          }
          if (mapTimeZone) opts.timeZone = mapTimeZone
          return new Intl.DateTimeFormat("en-US", opts).format(d)
        } catch (_) {
          // Bad/unsupported tz id -> fall back to the browser-local string
          // with the long tz name abbreviated to initials.
          return d.toString().replace(
            /\(([^)]+)\)/,
            (_m, name) => "(" + name.split(/\s+/).map(w => w[0] || "").join("") + ")"
          )
        }
      }

      function scWidth() {
        const w = scrubberEl.getBoundingClientRect().width || 200
        return Math.max(1, w - 2 * SC_PAD)
      }
      // epoch (within forecast range) -> x pixel, and inverse.
      function epochToX(epochSec) {
        if (forecastStart === null || forecastEnd === forecastStart) return SC_PAD
        const frac = (epochSec - forecastStart) / (forecastEnd - forecastStart)
        return SC_PAD + Math.max(0, Math.min(1, frac)) * scWidth()
      }
      function xToEpoch(x) {
        const frac = (x - SC_PAD) / scWidth()
        const raw = forecastStart + Math.max(0, Math.min(1, frac)) * (forecastEnd - forecastStart)
        return Math.round(raw)
      }

      // Redraw all three handles + the active segment from current state.
      function renderScrubber() {
        if (!scrubberReady) return
        const xs = epochToX(windowStart)
        const xe = epochToX(windowEnd)
        const xp = epochToX(time)
        scStartEl.setAttribute("x", String(xs - 3))
        scEndEl.setAttribute("x", String(xe - 3))
        scActive.setAttribute("x1", String(xs))
        scActive.setAttribute("x2", String(xe))
        scPlayheadEl.setAttribute("cx", String(xp))
        timeSliderLabel.textContent = fmtTime(time)
      }

      // Configure the scrubber once the forecast window is known. Named
      // configureScrubber (fetchGlobalRange calls it) and also aliased to the
      // old configureTimeSlider name used elsewhere.
      function configureScrubber() {
        if (forecastStart === null || forecastEnd === null) return
        scrubberReady = true
        renderScrubber()
      }
      function configureTimeSlider() { configureScrubber() }

      // --- URL persistence for the scrubber ---------------------------------
      // The window bounds and current time are stored as absolute epoch
      // seconds (from/to/t). On load they're clamped into the current forecast
      // range, so a shared/refreshed URL stays valid even if the forecast
      // window has since shifted.
      function persistScrubberState() {
        if (windowStart === null || windowEnd === null) return
        const u = new URL(window.location.href)
        u.searchParams.set("from", String(windowStart))
        u.searchParams.set("to", String(windowEnd))
        u.searchParams.set("t", String(time))
        history.replaceState(null, "", u.toString())
      }
      // Apply persisted from/to/t (if present) over the default full window.
      function applyUrlWindow() {
        if (forecastStart === null || forecastEnd === null) return
        const p = new URL(window.location.href).searchParams
        const clampRange = (v) => Math.max(forecastStart, Math.min(v, forecastEnd))
        const from = parseInt(p.get("from"), 10)
        const to = parseInt(p.get("to"), 10)
        const t = parseInt(p.get("t"), 10)
        const MIN_SPAN = Math.max(1, dt)
        if (Number.isFinite(from)) windowStart = clampRange(from)
        if (Number.isFinite(to)) windowEnd = clampRange(to)
        // Keep start < end with at least one dt of span.
        if (windowEnd <= windowStart) windowEnd = Math.min(forecastEnd, windowStart + MIN_SPAN)
        if (windowEnd <= windowStart) windowStart = Math.max(forecastStart, windowEnd - MIN_SPAN)
        if (Number.isFinite(t)) time = Math.max(windowStart, Math.min(t, windowEnd))
        else time = Math.max(windowStart, Math.min(time, windowEnd))
      }

      // Reflect the animation clock on the playhead (unless the user is
      // actively dragging something).
      function syncTimeSlider(t) {
        if (scrubbing) return
        renderScrubber()
      }

      // Pointer-driven dragging. `which` is "start" | "end" | "time".
      let dragWhich = null
      function pointerToEpoch(evt) {
        const rect = scrubberEl.getBoundingClientRect()
        return xToEpoch(evt.clientX - rect.left)
      }
      function beginDrag(which, evt) {
        if (!scrubberReady) return
        evt.stopPropagation(); evt.preventDefault()
        dragWhich = which
        if (!scrubbing) { // pause animation while interacting
          scrubbing = true
          resumeAfterScrub = !paused
          setPaused(true)
        }
        scrubberEl.setPointerCapture(evt.pointerId)
        onDrag(evt)
      }
      function onDrag(evt) {
        if (!dragWhich) return
        const MIN_SPAN = Math.max(1, dt) // keep at least one dt between bounds
        let e = pointerToEpoch(evt)
        if (dragWhich === "start") {
          // start can't exceed end (minus a span); clamp to forecast low.
          windowStart = Math.max(forecastStart, Math.min(e, windowEnd - MIN_SPAN))
          if (time < windowStart) time = windowStart // push playhead
        } else if (dragWhich === "end") {
          windowEnd = Math.min(forecastEnd, Math.max(e, windowStart + MIN_SPAN))
          if (time > windowEnd) time = windowEnd
        } else { // "time": constrained to [windowStart, windowEnd]
          time = Math.max(windowStart, Math.min(e, windowEnd))
        }
        renderScrubber()
        // Debounced frame load so dragging stays responsive.
        if (scrubLoadTimer) clearTimeout(scrubLoadTimer)
        scrubLoadTimer = window.setTimeout(() => { loadFrame(time) }, 60)
      }
      function endDrag(evt) {
        if (!dragWhich) return
        try { scrubberEl.releasePointerCapture(evt.pointerId) } catch (_) {}
        dragWhich = null
        // Load the final frame immediately, then resume if we were playing.
        if (scrubLoadTimer) { clearTimeout(scrubLoadTimer); scrubLoadTimer = null }
        loadFrame(time)
        persistScrubberState() // save window + time to the URL
        scrubbing = false
        if (resumeAfterScrub) setPaused(false)
        resumeAfterScrub = false
      }

      scStartEl.addEventListener("pointerdown", (e) => beginDrag("start", e))
      scEndEl.addEventListener("pointerdown", (e) => beginDrag("end", e))
      scPlayheadEl.addEventListener("pointerdown", (e) => beginDrag("time", e))
      // Clicking the track jumps the playhead there (within the window).
      scTrack.addEventListener("pointerdown", (e) => beginDrag("time", e))
      scActive.addEventListener("pointerdown", (e) => beginDrag("time", e))
      scrubberEl.addEventListener("pointermove", onDrag)
      scrubberEl.addEventListener("pointerup", endDrag)
      scrubberEl.addEventListener("pointercancel", endDrag)
      // Don't let scrubber interaction drag the legend.
      scrubberEl.addEventListener("pointerdown", (e) => e.stopPropagation())
      // Keep handles positioned correctly if the legend/window resizes.
      window.addEventListener("resize", renderScrubber)

      // Wire up the control buttons (stopPropagation so clicks don't drag the
      // legend).
      ;[["speedUp", () => stepSpeed(+1)],
        ["speedDown", () => stepSpeed(-1)],
        ["playPause", () => setPaused(!paused)],
        ["dtUp", () => stepDt(+1)],
        ["dtDown", () => stepDt(-1)],
        ["stepUp", () => stepContour(+1)],
        ["stepDown", () => stepContour(-1)]].forEach(([id, fn]) => {
        const btn = document.getElementById(id)
        btn.addEventListener("pointerdown", (e) => e.stopPropagation())
        btn.addEventListener("click", (e) => { e.stopPropagation(); fn() })
      })
      setPlaybackSpeed(playbackSpeed) // initialize the label
      setDt(dt) // initialize the dt label
      // Initialize the contour-interval label without disabling autoStep; the
      // real step is set by applyAutoStep() once the global range arrives.
      document.getElementById("stepLabel").textContent = formatStep(contourStep)

      showSpinner("Loading data…")
      loading = true
      try {
        // Cache all the area's NOAA data first, streaming progress to the
        // spinner as each resource is fetched.
        await prefetchWithProgress()
        // Fix the color scale to the whole-lifecycle range before rendering.
        await fetchGlobalRange()
        time = clampToForecast(time)
        await loadFrame(time) // first frame
      } catch (err) {
        console.error("failed to load initial frame:", err)
      } finally {
        loading = false
        hideSpinner()
      }

      async function tick() {
        // If a tick is already running, try again shortly rather than
        // returning without rescheduling (which would silently kill the loop).
        if (tickRunning) { scheduleNext(); return }
        // Don't animate while a (re)load is in progress — otherwise the old
        // area's frames keep playing underneath the loading spinner.
        if (loading) { scheduleNext(); return }
        tickRunning = true
        time += dt
        // Loop the animation: once we step past the playback window's end,
        // jump back to the window start.
        if (windowEnd !== null && time > windowEnd) {
          time = windowStart !== null ? windowStart : time
        }
        try {
          await loadFrame(time)
        } catch (err) {
          console.error("frame error:", err)
        } finally {
          tickRunning = false
          scheduleNext()
        }
      }
      scheduleNext()
    })

    // Dismiss the basemap attribution popup.
    const items = document.getElementsByClassName("maplibregl-ctrl-attrib-button")
    for (const item of items) { item.click() }

    // Model selector: populate from the server's registered models and, on
    // change, navigate to that model's URL. Changing the model swaps the color
    // ramp, units, step defaults and derived kind — all computed server-side —
    // so a full navigation (reload) is the simplest correct approach. We keep
    // the current view (lat/lon/size/zoom/dt/speed) but drop `step` and `kind`
    // so the new model's auto-step and derived kind take effect.
    ;(function setupModelSelect() {
      const sel = document.getElementById("modelSelect")
      if (!sel) return
      for (const opt of modelOptions) {
        const o = document.createElement("option")
        o.value = opt.value
        o.textContent = opt.label
        if (opt.value === currentModel) o.selected = true
        sel.appendChild(o)
      }
      // Don't let interacting with the select start a legend drag.
      sel.addEventListener("pointerdown", (e) => e.stopPropagation())
      sel.addEventListener("change", (e) => {
        e.stopPropagation()
        const newModel = sel.value
        if (!newModel || newModel === currentModel) return
        const cur = new URL(window.location.href)
        const next = new URL(`/map/models/${encodeURIComponent(newModel)}/`, window.location.origin)
        // Carry over view/animation params; drop model-specific ones.
        for (const k of ["lat", "lon", "width", "height", "dt", "zoom", "speed"]) {
          const v = cur.searchParams.get(k)
          if (v !== null) next.searchParams.set(k, v)
        }
        window.location.assign(next.toString())
      })
    })()

    // Make the legend draggable.
    ;(function makeLegendDraggable() {
      const el = document.getElementById("legend")
      if (!el) return
      let dragging = false, offsetX = 0, offsetY = 0
      el.addEventListener("pointerdown", (e) => {
        dragging = true
        const rect = el.getBoundingClientRect()
        offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top
        el.style.top = rect.top + "px"; el.style.left = rect.left + "px"
        el.setPointerCapture(e.pointerId); e.preventDefault()
      })
      el.addEventListener("pointermove", (e) => {
        if (!dragging) return
        const maxX = window.innerWidth - el.offsetWidth, maxY = window.innerHeight - el.offsetHeight
        el.style.left = Math.max(0, Math.min(e.clientX - offsetX, maxX)) + "px"
        el.style.top = Math.max(0, Math.min(e.clientY - offsetY, maxY)) + "px"
      })
      el.addEventListener("pointerup", (e) => { dragging = false; el.releasePointerCapture(e.pointerId) })
    })()
  </script>
</html>
