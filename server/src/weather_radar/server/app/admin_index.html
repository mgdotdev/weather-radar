<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Weather Radar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif;
      background: #f3f4f6; color: #1f2430; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    .head { display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0; }
    .signout { border: 1px solid #d1d5db; background: #fff; border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer; color: #374151; }
    a.tile { display: block; text-decoration: none; color: inherit;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
      padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: box-shadow .12s, transform .12s; }
    a.tile:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.10); transform: translateY(-1px); }
    .tile .t { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .tile .d { font-size: 13px; color: #6b7280; }
    .tile .chev { float: right; color: #9ca3af; font-size: 20px; line-height: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Admin</h1>
      <button class="signout" id="signout">Sign out</button>
    </div>

    <a class="tile" href="/admin/hotcache">
      <span class="chev">›</span>
      <div class="t">Hot cache</div>
      <div class="d">Keep forecast URLs warm — add/remove watched URLs and see scheduler status.</div>
    </a>

    <a class="tile" href="/admin/tokens">
      <span class="chev">›</span>
      <div class="t">Access tokens</div>
      <div class="d">Generate and revoke access tokens for embedding the app (e.g. a Home Assistant dashboard).</div>
    </a>
  </div>

  <script>
    document.getElementById("signout").addEventListener("click", async () => {
      try { await fetch("/api/auth/logout", { method: "POST" }); } catch (_) {}
      window.location.href = "/login";
    });
  </script>
</body>
</html>
